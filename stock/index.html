<html lang="fr"><head>

<style>
:root{--bg:#faf6f2;--card:#fff;--ink:#14231f;--mut:#5d7069;--line:#eadfd5;--p:#ea580c;--p2:#9a3412;--pl:#ffedd5;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex:none}
.top h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:.3px}
.ib{background:#ffffff26;border:0;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:15px;font-weight:700}
main{flex:1;overflow-y:auto;padding:12px 14px 96px;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800;font-size:16px;padding:14px;margin:8px 0;text-align:center}
.btn.g{background:var(--pl);color:var(--p2)}
.btn.r{background:#fbe9e7;color:var(--red)}
.btn.s{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:4px 4px 4px 0}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.tab{flex:none;padding:8px 13px;border-radius:20px;background:var(--bg);font-weight:700;font-size:14px;color:var(--mut);white-space:nowrap}
.tab.on{background:var(--p);color:#fff}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:612px;margin:0 auto;background:var(--p2);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;box-shadow:0 6px 18px #0003}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--pl);color:var(--p2);border-radius:16px;padding:6px 11px;font-size:13px;font-weight:700}
.h{font-weight:800;font-size:17px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.item{border-left:4px solid var(--p);padding-left:10px;margin:10px 0}
.pv{background:#cfd8d5;padding:10px 0}
.pv canvas{display:block;width:100%;height:auto;margin:0 auto 12px;box-shadow:0 2px 10px #0003;background:#fff;max-width:640px}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px 6px 4px 0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.tpl{flex:1;white-space:nowrap;padding-left:10px!important;padding-right:10px!important;border:2px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-weight:800;font-size:14px;background:#fff}
.tpl.on{border-color:var(--p);background:var(--pl);color:var(--p2)}
.photo{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--pl);border:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14231fe6;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.cvrow{display:flex;align-items:center;gap:10px}
.cvrow .grow{flex:1;min-width:0}
.cvrow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:34px;font-weight:900;color:var(--p);text-align:center;margin:20px 0 4px}
</style></head><body>
<div id="app"></div>
<script>
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(s){return document.querySelector(s);}
function uid(){return Math.random().toString(36).slice(2,9);}
function canvasJpeg(c){return new Promise(function(res){c.toBlob(function(b){var fr=new FileReader();fr.onload=function(){res(new Uint8Array(fr.result));};fr.readAsArrayBuffer(b);},"image/jpeg",0.92);});}
function strBytes(s){var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a;}
var WIN={8226:149,8211:150,8212:151,8217:146,8216:145,8220:147,8221:148,8364:128,8230:133};
function winAnsi(t){var o="";for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if(WIN[c])c=WIN[c];if(c===40||c===41||c===92){o+="\\"+String.fromCharCode(c);}else if(c>=32&&c<127||c>=160&&c<256||c>=128&&c<160&&WIN[t.charCodeAt(i)]){o+=String.fromCharCode(c);}else if(c===32){o+=" ";}}return o;}
function buildPDF(jpegs,w,h,texts){
 var parts=[],off=0,xref=[];function add(b){parts.push(b);off+=b.length;}
 function obj(n,body){xref[n]=off;add(strBytes(n+" 0 obj\n"));add(typeof body==="string"?strBytes(body):body);add(strBytes("\nendobj\n"));}
 add(strBytes("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
 var np=jpegs.length,kids=[],pw=595.28,ph=841.89,sc=ph/h;for(var i=0;i<np;i++)kids.push((5+i*3)+" 0 R");
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
 obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+np+" >>");
 obj(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
 obj(4,"<< /Producer (Stock Express) >>");
 for(var k=0;k<np;k++){var base=5+k*3;
  obj(base,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 "+(base+2)+" 0 R >> /Font << /F1 3 0 R >> >> /Contents "+(base+1)+" 0 R >>");
  var cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q\nBT 3 Tr\n";
  (texts&&texts[k]||[]).forEach(function(t){var s2=winAnsi(t.s);if(!s2.trim())return;cs+="/F1 "+(t.sz*sc).toFixed(2)+" Tf 1 0 0 1 "+(t.x*sc).toFixed(2)+" "+((h-t.y)*sc).toFixed(2)+" Tm ("+s2+") Tj\n";});
  cs+="ET";obj(base+1,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  var img=jpegs[k],head=strBytes("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+img.length+" >>\nstream\n"),tail=strBytes("\nendstream"),b=new Uint8Array(head.length+img.length+tail.length);b.set(head,0);b.set(img,head.length);b.set(tail,head.length+img.length);obj(base+2,b);}
 var xo=off,n=5+np*3;add(strBytes("xref\n0 "+n+"\n0000000000 65535 f \n"));
 for(var j=1;j<n;j++){var s=String(xref[j]);add(strBytes("0000000000".slice(s.length)+s+" 00000 n \n"));}
 add(strBytes("trailer\n<< /Size "+n+" /Root 1 0 R /Info 4 0 R >>\nstartxref\n"+xo+"\n%%EOF"));
 return new Blob(parts,{type:"application/pdf"});
}

function cap(){var C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?C:null;}
function nativeShare(name,blob){var C=cap(),P=C.Plugins||{},FS=P.Filesystem,SH=P.Share;
 return new Promise(function(res,rej){if(!FS||!SH){rej(new Error("plugin"));return;}var fr=new FileReader();fr.onload=function(){var b64=String(fr.result).split(",")[1];
  FS.writeFile({path:name,data:b64,directory:"CACHE"}).then(function(r){return SH.share({title:name,files:[r.uri]});}).then(res,rej);};fr.readAsDataURL(blob);});}
function saveBlob(name,blob){
 if(cap()){nativeShare(name,blob).catch(function(){toast(X("Partage impossible sur cet appareil","Sharing not possible on this device"));});return;}
 try{var f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(function(){});return;}}catch(x){}
 try{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(X("Fichier prêt","File ready"));}catch(e){toast(X("Téléchargement impossible ici","Download not possible here"));}
}

function loadPhoto(src){return new Promise(function(res){if(!src){res(null);return;}var i=new Image();i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}


/* ---------- pubs : 3 pubs regardées = modèles premium ---------- */
var ADS={gameId:"800433454",rewarded:"Rewarded_Android",test:false,need:3},PREM={dark:1,band:1,timeline:1};
var adsPlug=null,adsReady=false,adsBusy=false;
function adCount(){try{return Math.min(ADS.need,+localStorage.getItem("cv_ads")||0);}catch(e){return 0;}}
function adSet(n){try{localStorage.setItem("cv_ads",String(n));}catch(e){}}
function isLocked(t){return !!PREM[t]&&adCount()<ADS.need;}
function adsPlugin(){if(adsPlug)return adsPlug;try{var C=window.Capacitor;if(!C||!(C.isNativePlatform?C.isNativePlatform():false))return null;adsPlug=(C.Plugins&&C.Plugins.UnityAds)||(C.registerPlugin?C.registerPlugin("UnityAds"):null);}catch(e){adsPlug=null;}return adsPlug;}
function adsShow(){var pl=adsPlugin();if(!pl)return Promise.resolve({completed:false,error:"web"});if(adsBusy)return Promise.resolve({completed:false,error:"busy"});adsBusy=true;
 var ini=adsReady?Promise.resolve():pl.init({gameId:ADS.gameId,test:ADS.test}).then(function(){adsReady=true;});
 return ini.then(function(){return pl.showAd({placement:ADS.rewarded});}).then(function(r){adsBusy=false;return r||{completed:false};}).catch(function(e){adsBusy=false;return {completed:false,error:String(e&&e.message||e)};});}

function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},1900);}
function shell(title,left,body,extra){
 $("#app").innerHTML='<div class="top">'+(left||"")+'<h1>'+esc(title)+'</h1>'+(extra||"")+'</div>'+body;}

/* ================== Stock Express ================== */
var LANG="fr";function X(fr){return fr;}
var SAVE={shop:{name:"",cur:"FCFA"},prods:[],moves:[]};
try{var _s=JSON.parse(localStorage.getItem("st_v1"));if(_s&&_s.prods)SAVE=_s;}catch(e){}
SAVE.shop=SAVE.shop||{name:"",cur:"FCFA"};
var TAB="stock",Q="",saveT=null,FREE=30;
function persist(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem("st_v1",JSON.stringify(SAVE));}catch(e){}},200);}
function isPremium(){return !cap()||adCount()>=ADS.need;}
function dec(){return SAVE.shop.cur==="FCFA"?0:2;}
function money(n){n=+n||0;var d=dec(),neg=n<0;n=Math.abs(n);var s=n.toFixed(d),p=s.split("."),i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");return (neg?"-":"")+i+(p[1]?","+p[1]:"");}
function cur(){return SAVE.shop.cur==="FCFA"?"FCFA":SAVE.shop.cur==="EUR"?"€":"$";}
function num(v){return +String(v==null?"":v).replace(",",".").replace(/\s/g,"")||0;}
function pad(n){return ("0"+n).slice(-2);}
function dstr(ms){var d=new Date(ms);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
function day0(ms){var d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();}
function prod(id){return SAVE.prods.filter(function(p){return p.id===id;})[0];}
function state(p){return p.qty<=0?"out":(p.min>0&&p.qty<=p.min)?"low":"ok";}
function qn(n){return String(Math.round(n*1000)/1000).replace(".",",");}
/* ---------- bilan ---------- */
function sold(a,b){var s=0,pf=0,n=0;SAVE.moves.forEach(function(m){if(m.t==="out"&&m.d>=a&&m.d<b){s+=m.q*m.price;pf+=m.q*(m.price-(m.cost||0));n+=m.q;}});return {s:s,pf:pf,n:n};}
function stats(){var vb=0,vs=0,low=[],out=[];SAVE.prods.forEach(function(p){vb+=p.qty*p.buy;vs+=p.qty*p.sell;var st=state(p);if(st==="out")out.push(p);else if(st==="low")low.push(p);});
 var t0=day0(Date.now()),D=86400000;return {vb:vb,vs:vs,low:low,out:out,today:sold(t0,t0+D),w:sold(t0-6*D,t0+D),m:sold(t0-29*D,t0+D)};}
/* ---------- écrans ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function tabs(){return '<div class="tabs">'+[["stock","📦 Stock"],["moves","🔁 Mouvements"],["bilan","📊 Bilan"],["menu","⚙ Plus"]].map(function(t){return '<span class="tab'+(TAB===t[0]?' on':'')+'" style="flex:1;text-align:center;padding:8px 4px;font-size:13px" onclick="TAB=\''+t[0]+'\';home()">'+t[1]+'</span>';}).join("")+'</div>';}
function home(){var h='';
 if(TAB==="stock")h=vStock();else if(TAB==="moves")h=vMoves();else if(TAB==="bilan")h=vBilan();else h=vMenu();
 $("#app").innerHTML='<div class="top"><h1>'+esc(SAVE.shop.name||"Stock Express")+'</h1></div>'+tabs()+'<main><div class="wrap">'+h+'</div></main>'+(TAB==="stock"?'<button class="fab" onclick="prodForm()">＋ Nouveau produit</button>':'');}
function vStock(){var L=SAVE.prods.slice().sort(function(a,b){return a.n.localeCompare(b.n);}),q=Q.toLowerCase();if(q)L=L.filter(function(p){return (p.n+" "+(p.cat||"")).toLowerCase().indexOf(q)>=0;});
 var st=stats(),h='';
 if(SAVE.prods.length)h+='<button class="btn" style="margin:6px 0" onclick="invForm()">🧾 Facturer une vente</button><input id="sq" placeholder="🔍 Rechercher un produit" value="'+esc(Q)+'" oninput="Q=this.value;listOnly()" style="margin:6px 0">';
 if(st.out.length||st.low.length)h+='<div class="card" style="background:#fff1e6;border-color:#f6c9a5">⚠ <b>'+st.out.length+'</b> en rupture · <b>'+st.low.length+'</b> stock bas</div>';
 h+='<div id="lst">'+listHtml(L)+'</div>';return h;}
function listHtml(L){if(!SAVE.prods.length)return '<p class="mut" style="text-align:center;margin:40px 0">Aucun produit pour le moment.<br>Appuie sur « Nouveau produit » pour commencer.</p>';if(!L.length)return '<p class="mut" style="text-align:center;margin:30px 0">Aucun résultat.</p>';
 return L.map(function(p){var s=state(p),badge=s==="out"?'<span class="chip" style="background:#fbe9e7;color:#c0392b">Rupture</span>':s==="low"?'<span class="chip" style="background:#fff1d6;color:#b45309">Stock bas</span>':'';
 return '<div class="card cvrow"><div class="grow" onclick="prodView(\''+p.id+'\')"><b>'+esc(p.n)+'</b><span class="mut">'+qn(p.qty)+' '+esc(p.unit||"pièce")+' · vente '+money(p.sell)+' '+cur()+'</span>'+badge+'</div><button class="btn s g" onclick="mvForm(\''+p.id+'\',\'in\')">＋</button><button class="btn s" onclick="mvForm(\''+p.id+'\',\'out\')">−</button></div>';}).join("");}
function listOnly(){var q=Q.toLowerCase(),L=SAVE.prods.slice().sort(function(a,b){return a.n.localeCompare(b.n);});if(q)L=L.filter(function(p){return (p.n+" "+(p.cat||"")).toLowerCase().indexOf(q)>=0;});var e=$("#lst");if(e)e.innerHTML=listHtml(L);}
function vMoves(){var L=SAVE.moves.slice().sort(function(a,b){return b.d-a.d;}).slice(0,200);if(!L.length)return '<p class="mut" style="text-align:center;margin:40px 0">Aucun mouvement pour le moment.</p>';
 return L.map(function(m){var p=prod(m.pid),n=p?p.n:"(produit supprimé)",lab=m.t==="in"?"Entrée":m.t==="out"?"Vente":"Ajustement",sg=m.t==="out"?"−":(m.q<0?"−":"+"),col=m.t==="out"?"#c0392b":"#15803d";
 return '<div class="card cvrow"><div class="grow"><b>'+esc(n)+'</b><span class="mut">'+lab+' · '+dstr(m.d)+(m.note?' · '+esc(m.note):'')+(m.t==="out"?' · '+money(m.q*m.price)+' '+cur():'')+'</span></div><b style="color:'+col+'">'+sg+qn(Math.abs(m.q))+'</b><button class="btn s r" onclick="undoMove(\''+m.id+'\')">↩</button></div>';}).join("");}
function bars(){var D=86400000,t0=day0(Date.now()),v=[],mx=1,lab=["D","L","M","M","J","V","S"];for(var i=6;i>=0;i--){var a=t0-i*D,s=sold(a,a+D).s;v.push({s:s,l:lab[new Date(a).getDay()]});if(s>mx)mx=s;}
 return '<div style="display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px">'+v.map(function(x){return '<div style="flex:1;text-align:center"><div style="height:'+Math.max(3,Math.round(x.s/mx*84))+'px;background:var(--p);border-radius:6px 6px 0 0"></div><div class="mut">'+x.l+'</div></div>';}).join("")+'</div>';}
function top5(){var o={};SAVE.moves.forEach(function(m){if(m.t==="out"&&m.d>=Date.now()-30*86400000)o[m.pid]=(o[m.pid]||0)+m.q;});return Object.keys(o).map(function(k){return {p:prod(k),q:o[k]};}).filter(function(x){return x.p;}).sort(function(a,b){return b.q-a.q;}).slice(0,5);}
function vBilan(){var s=stats(),h='<div class="card"><div class="h">Valeur du stock</div><div style="font-size:26px;font-weight:900;color:var(--p)">'+money(s.vb)+' '+cur()+'</div><div class="mut">au prix d\'achat · à la vente : <b>'+money(s.vs)+' '+cur()+'</b></div></div>';
 h+='<div class="card"><div class="h">Ventes</div><div class="row"><div><div class="mut">Aujourd\'hui</div><b>'+money(s.today.s)+'</b></div><div><div class="mut">7 jours</div><b>'+money(s.w.s)+'</b></div><div><div class="mut">30 jours</div><b>'+money(s.m.s)+'</b></div></div><div class="mut" style="margin-top:8px">Bénéfice estimé (30 jours) : <b style="color:#15803d">'+money(s.m.pf)+' '+cur()+'</b></div>'+bars()+'</div>';
 var t=top5();if(t.length)h+='<div class="card"><div class="h">Les plus vendus (30 jours)</div>'+t.map(function(x){return '<div class="row" style="padding:4px 0"><span>'+esc(x.p.n)+'</span><b style="text-align:right">'+qn(x.q)+' '+esc(x.p.unit||"")+'</b></div>';}).join("")+'</div>';
 if(s.out.length||s.low.length)h+='<div class="card"><div class="h">À réapprovisionner</div>'+s.out.concat(s.low).map(function(p){return '<div class="row" style="padding:4px 0"><span>'+esc(p.n)+'</span><b style="text-align:right;color:'+(p.qty<=0?'#c0392b':'#b45309')+'">'+qn(p.qty)+'</b></div>';}).join("")+'</div>';
 return h;}
function vMenu(){var pr=isPremium();return '<div class="card"><div class="h">Ma boutique</div><label>Nom</label><input value="'+esc(SAVE.shop.name)+'" placeholder="Ex : Boutique Akossiwa" oninput="SAVE.shop.name=this.value;persist()"><label>Adresse</label><input value="'+esc(SAVE.shop.addr)+'" placeholder="Lomé, Togo" oninput="SAVE.shop.addr=this.value;persist()"><label>Téléphone</label><input inputmode="tel" value="'+esc(SAVE.shop.phone)+'" oninput="SAVE.shop.phone=this.value;persist()"><label>NIF / RCCM (facultatif)</label><input value="'+esc(SAVE.shop.nif)+'" oninput="SAVE.shop.nif=this.value;persist()"><label>Paiement (Mixx / Flooz / banque)</label><textarea oninput="SAVE.shop.pay=this.value;persist()" placeholder="Ex : Mixx by Yas : 90 00 00 00">'+esc(SAVE.shop.pay)+'</textarea><label>Devise</label><select onchange="SAVE.shop.cur=this.value;persist()">'+[["FCFA","FCFA (franc CFA)"],["EUR","Euro (€)"],["USD","Dollar ($)"]].map(function(c){return '<option value="'+c[0]+'"'+(SAVE.shop.cur===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join("")+'</select></div>'+
 '<div class="card"><div class="h">⭐ Premium '+(pr?'(débloqué)':'')+'</div><div class="mut" style="margin-bottom:8px">Plus de '+FREE+' produits, rapport PDF et export Excel (CSV).'+(pr?'':' Regarde 3 pubs, une seule fois.')+'</div>'+(pr?'':'<button class="btn" onclick="unlockBox()">▶ Débloquer ('+adCount()+' / '+ADS.need+')</button>')+'<button class="btn g" onclick="exportPDF()">📄 Rapport d\'inventaire (PDF)</button><button class="btn g" onclick="exportCSV()">📊 Export Excel (CSV)</button></div>'+

 var sy=Math.max(y+40,PH-300);if(sy>PH-150)sy=PH-150;tx(pg,"Cachet et signature",PW-M-20,sy,24,"700","#6b5b4e","r");pg.x.fillStyle="#cfd6e4";pg.x.fillRect(PW-M-340,sy+110,340,2);
 pages.forEach(function(p,i){if(pages.length>1)tx(p,"Page "+(i+1)+" / "+pages.length,PW-M,PH-50,20,"400","#8892a6","r");if(!isPremium())tx(p,"Créé avec Stock Express",PW/2,PH-50,20,"400","#a3acbd","c");});
 return pages;}

/* ---------- facturer ---------- */
SAVE.invoices=SAVE.invoices||[];SAVE.shop=Object.assign({addr:"",phone:"",email:"",nif:"",pay:"",cnt:0},SAVE.shop);
var CART=null;
function invNext(){SAVE.shop.cnt=(SAVE.shop.cnt||0)+1;return "FAC-"+new Date().getFullYear()+"-"+("00"+SAVE.shop.cnt).slice(-3);}
function invForm(){if(!SAVE.prods.length){toast("Ajoute d'abord des produits");return;}CART={cn:"",cp:"",items:[{pid:"",q:1,p:""}],tax:"",disc:"",paid:"",notes:""};invUI();}
function invTot(){var d={items:CART.items.map(function(i){return {q:num(i.q),p:num(i.p)};}),tax:num(CART.tax),disc:num(CART.disc),paid:num(CART.paid)};return calc(d);}
function invUI(){var o=document.getElementById("inv");if(!o){o=document.createElement("div");o.id="inv";o.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:45;overflow:auto";document.body.appendChild(o);}
 var h='<div class="top"><button class="ib" onclick="document.getElementById(\'inv\').remove()">✕</button><h1>Nouvelle facture</h1></div><main><div class="wrap"><div class="card"><div class="h">Client</div><label>Nom</label><input value="'+esc(CART.cn)+'" placeholder="Nom du client" oninput="CART.cn=this.value"><label>Téléphone (facultatif)</label><input inputmode="tel" value="'+esc(CART.cp)+'" oninput="CART.cp=this.value"></div>';
 CART.items.forEach(function(it,i){var p=prod(it.pid);h+='<div class="card"><div class="row" style="align-items:center"><b style="flex:none">Ligne '+(i+1)+'</b><span class="mut" style="text-align:right" id="lm'+i+'">'+money(num(it.q)*num(it.p))+' '+cur()+'</span></div><label>Produit</label><select onchange="invPick('+i+',this.value)"><option value="">— choisir —</option>'+SAVE.prods.slice().sort(function(a,b){return a.n.localeCompare(b.n);}).map(function(x){return '<option value="'+x.id+'"'+(x.id===it.pid?' selected':'')+'>'+esc(x.n)+' ('+qn(x.qty)+')</option>';}).join("")+'</select><div class="row"><div><label>Quantité</label><input inputmode="decimal" value="'+esc(it.q)+'" oninput="CART.items['+i+'].q=this.value;invTotUp()"></div><div><label>Prix ('+cur()+')</label><input id="lp'+i+'" inputmode="decimal" value="'+esc(it.p)+'" oninput="CART.items['+i+'].p=this.value;invTotUp()"></div></div>'+(CART.items.length>1?'<button class="btn s r" style="margin-top:8px" onclick="CART.items.splice('+i+',1);invUI()">✕ Retirer</button>':'')+'</div>';});
 h+='<button class="btn g" onclick="CART.items.push({pid:\'\',q:1,p:\'\'});invUI()">＋ Ajouter une ligne</button><div class="card"><div class="h">Montants</div><div class="row"><div><label>Remise (%)</label><input inputmode="decimal" value="'+esc(CART.disc)+'" placeholder="0" oninput="CART.disc=this.value;invTotUp()"></div><div><label>TVA (%)</label><input inputmode="decimal" value="'+esc(CART.tax)+'" placeholder="0" oninput="CART.tax=this.value;invTotUp()"></div></div><label>Acompte déjà versé ('+cur()+')</label><input inputmode="decimal" value="'+esc(CART.paid)+'" placeholder="0" oninput="CART.paid=this.value;invTotUp()"><div id="itot" style="margin-top:12px;font-size:17px"></div></div><div class="card"><label>Notes (facultatif)</label><textarea oninput="CART.notes=this.value" placeholder="Ex : Paiement à la livraison.">'+esc(CART.notes)+'</textarea></div><div class="mut" style="margin:0 4px 10px">La vente sera enregistrée et le stock diminuera automatiquement.</div><button class="btn" onclick="invSave()">✓ Enregistrer et créer le PDF</button></div></main>';
 o.innerHTML=h;invTotUp();}
function invPick(i,id){var p=prod(id);CART.items[i].pid=id;if(p){CART.items[i].p=p.sell;var e=document.getElementById("lp"+i);if(e)e.value=p.sell;}invTotUp();}
function invTotUp(){var c=invTot(),e=document.getElementById("itot");if(e)e.innerHTML='Total : <b>'+money(c.total)+' '+cur()+'</b>'+(c.paid>0?'<br>Reste à payer : <b>'+money(Math.max(0,c.rest))+' '+cur()+'</b>':'');CART.items.forEach(function(it,i){var m=document.getElementById("lm"+i);if(m)m.textContent=money(num(it.q)*num(it.p))+" "+cur();});}
function invSave(){var L=CART.items.filter(function(i){return i.pid&&num(i.q)>0;});if(!L.length){toast("Choisis au moins un produit");return;}
 var short=L.filter(function(i){return num(i.q)>prod(i.pid).qty;}).map(function(i){return prod(i.pid).n;});if(short.length&&!confirm("Stock insuffisant pour : "+short.join(", ")+". Continuer ?"))return;
 var num_=invNext(),now=Date.now(),inv={id:uid(),num:num_,d:now,cn:CART.cn.trim(),cp:CART.cp.trim(),items:L.map(function(i){var p=prod(i.pid);return {pid:i.pid,n:p.n,q:num(i.q),p:num(i.p)};}),tax:num(CART.tax),disc:num(CART.disc),paid:num(CART.paid),notes:CART.notes.trim()};
 inv.items.forEach(function(i){var p=prod(i.pid);p.qty-=i.q;SAVE.moves.push({id:uid(),pid:i.pid,t:"out",q:i.q,price:i.p,cost:p.buy,d:now,note:num_+(inv.cn?" · "+inv.cn:"")});});
 SAVE.invoices.push(inv);persist();var o=document.getElementById("inv");if(o)o.remove();home();invPDF(inv);}
function invDoc(inv){return {type:"facture",num:inv.num,date:iso(inv.d),due:"",cn:inv.cn,ca:"",cp:inv.cp,items:inv.items.map(function(i){return {d:i.n,q:i.q,p:i.p};}),tax:inv.tax,disc:inv.disc,paid:inv.paid,notes:inv.notes};}
function invPDF(inv){toast("Création de la facture…");var pages=renderDoc(invDoc(inv),null);Promise.all(pages.map(function(p){return canvasJpeg(p.c);})).then(function(j){saveBlob(("Facture-"+inv.num+"-"+(inv.cn||"")).replace(/[^\wÀ-ÿ-]+/g,"-").replace(/-+/g,"-").replace(/-$/,"")+".pdf",buildPDF(j,PW,PH,pages.map(function(p){return p.c.__t;})));}).catch(function(){toast("Impossible de créer le PDF");});}
function invList(){var L=SAVE.invoices.slice().sort(function(a,b){return b.d-a.d;}).slice(0,20);if(!L.length)return '<div class="mut">Aucune facture pour le moment.</div>';
 return L.map(function(v){var t=calc({items:v.items.map(function(i){return {q:i.q,p:i.p};}),tax:v.tax,disc:v.disc,paid:0}).total;return '<div class="row" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(v.num)+'</b><div class="mut">'+esc(v.cn||"Sans client")+' · '+dstr(v.d)+' · '+money(t)+' '+cur()+'</div></div><button class="btn s g" style="flex:none" onclick="invPDF(SAVE.invoices.filter(function(x){return x.id===\''+v.id+'\'})[0])">📄</button></div>';}).join("");}
