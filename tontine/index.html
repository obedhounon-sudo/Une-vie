<style>
:root{--bg:#fbf1e1;--card:#fff;--ink:#2a1a12;--mut:#7d6a5c;--brand:#7a2e1d;--gold:#e8a427;--green:#2e8f63;--red:#c8432b;--line:#ecdcc4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:40px}
#app{max-width:520px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl{font-weight:900;font-size:19px}
.sub{font-size:12px;opacity:.85}
.chips{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 8px;text-align:center;font-size:11px}
.chip b{display:block;font-size:16px}
.prog{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.gear{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:6px 0;line-height:1.45}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#f6e3c4;color:#6a4a10;margin-bottom:8px}
.big{font-size:44px;line-height:1}
.btn{display:block;width:100%;margin-top:10px;padding:14px 14px;border:0;border-radius:14px;font-size:16px;font-weight:700;text-align:left;background:#f4e6cf;color:var(--ink);cursor:pointer}
.btn small{display:block;font-weight:500;color:var(--mut);margin-top:2px;font-size:12.5px}
.btn:active{transform:scale(.99)}
.btn.main{background:var(--gold);text-align:center;color:#2b1a00}
.btn:disabled{opacity:.45}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fx span{font-size:13px;font-weight:700;padding:4px 9px;border-radius:99px}
.up{background:#dcf1e6;color:#1d6b46}.dn{background:#f8dcd5;color:#a8321d}.ne{background:#efe6d6;color:#6a5a48}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.m{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 10px;position:relative}
.m.rcv{border:2px solid var(--gold);background:#fff8e6}
.m.out{opacity:.35}
.m .nm{font-weight:800;font-size:14px}
.m .jb{font-size:11.5px;color:var(--mut)}
.m .e{font-size:26px;float:right}
.bar{height:7px;border-radius:4px;background:#efe3d0;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.bd{font-size:11px;margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.bd span{padding:2px 6px;border-radius:99px;background:#efe6d6}
.bd .w{background:#f8dcd5;color:#a8321d}.bd .g{background:#fbe9b6;color:#6a4a10}.bd .k{background:#dcf1e6;color:#1d6b46}
.sec{margin:16px 2px 0;font-weight:800;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row2{display:flex;gap:8px}.row2 .btn{text-align:center}
.score{font-size:64px;font-weight:900;color:var(--brand);text-align:center;line-height:1}
.center{text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}
.lang{display:flex;gap:8px}.lang .btn{text-align:center}
.on{outline:3px solid var(--gold)}
</style></head><body>

function U(k){return (UI[S.lang]||UI.fr)[k];}
function L(o){return typeof o==="string"?o:(o[S.lang]||o.fr);}
function nm(i){return MEM[i].n;}
function fill(t,a,b,r){return t.replace(/\{a\}/g,nm(a)).replace(/\{b\}/g,nm(b)).replace(/\{r\}/g,nm(r)).replace(/\{c\}/g,String(S.contrib)).replace(/\{p\}/g,fmt(S.pot)).replace(/\{s\}/g,"");}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");}

/* ============ Moteur ============ */
function active(){var r=[];S.mem.forEach(function(m,i){if(!m.left)r.push(i);});return r;}
function receiver(){
 for(var pass=0;pass<2;pass++){
  for(var k=0;k<S.order.length;k++){var i=S.order[k];var m=S.mem[i];if(!m.left&&!m.got)return i;}
  S.mem.forEach(function(m){m.got=false;});S.tour++;
 }
 return active()[0];
}
function snap(){return S.mem.map(function(m){return m.trust;}).concat([S.caisse]);}
function diffs(before){
 var out=[];
 for(var i=0;i<8;i++){var d=S.mem[i].trust-before[i];if(d&&!S.mem[i].left||(d&&before[i]>0))out.push({t:nm(i)+" "+(d>0?"+":"")+d,c:d>0?"up":"dn"});}
 var dc=S.caisse-before[8];if(dc)out.push({t:"💰 "+(dc>0?"+":"−")+fmt(Math.abs(dc))+" F",c:dc>0?"up":"dn"});
 return out;
}
var lastEv=[];
function startWeek(){
 S.week++;
 var act=active();
 S.rcv=receiver();S.r0=S.rcv;
 S.pot=0;S.unp=[];
 act.forEach(function(i){
  var m=S.mem[i],tr=TRAITS[MEM[i].t];
  var p=tr.p-(m.hard>0?.35:0);
  if(chance(p)){S.pot+=S.contrib+m.owe;m.owe=0;}else S.unp.push(i);
  if(m.hard>0)m.hard--;
 });
 S.dfl=S.unp.length?S.unp[0]:-1;
 // les autres retardataires: délai automatique
 S.unp.slice(1).forEach(function(i){S.mem[i].owe+=S.contrib;});
 // choisir événement
 var pool=EVENTS.filter(function(e){return lastEv.indexOf(e.id)<0;});
 var ev=pool[Math.floor(Math.random()*pool.length)];
 lastEv.push(ev.id);if(lastEv.length>5)lastEv.shift();
 var rest=shuffle(act.slice());
 S.a=rest[0];S.b=rest[1]!==undefined?rest[1]:rest[0];
 S.ev=ev.id;S.fxl=[];S.lastRes=null;
 S.phase=S.dfl>=0?"default":"event";
 save();
}
function evById(id){for(var i=0;i<EVENTS.length;i++)if(EVENTS[i].id===id)return EVENTS[i];}
function choose(idx){
 var before=snap(),res;
 if(S.phase==="default"){
  var d=S.dfl;
  if(idx===0){C(-S.contrib);P(S.contrib);T(d,6);res={fr:"La caisse avance la cotisation de "+nm(d)+".",en:"The fund covers "+nm(d)+"'s contribution."};}
  else if(idx===1){T(d,2);S.mem[d].owe+=S.contrib;res={fr:nm(d)+" te remercie et promet de payer double.",en:nm(d)+" thanks you and promises to pay double."};}
  else{T(d,-8);if(chance(.65)){P(S.contrib);res={fr:nm(d)+" paie, un peu vexé.",en:nm(d)+" pays, a little offended."};}else{S.mem[d].owe+=S.contrib;res={fr:nm(d)+" ne paie pas et claque la porte.",en:nm(d)+" does not pay and storms off."};}}
  S.lastRes=res;S.fxl=diffs(before);S.phase="dres";save();render();return;
 }
 var ev=evById(S.ev),ch=ev.ch[idx];
 if(ch.c&&S.caisse<ch.c)return;
 res=ch.f(S.a,S.b,S.rcv);
 S.lastRes=res;S.fxl=diffs(before);S.phase="eres";var up=S.fxl.filter(function(f){return f.c==='up';}).length>=S.fxl.filter(function(f){return f.c==='dn';}).length;beep(up?660:220,.25);vib(up?20:[30,40,30]);save();render();
}
function toEvent(){S.phase="event";save();render();}
function toPayout(){
 var before=snap(),r=S.rcv;
 if(S.mem[r].left)r=S.rcv=receiver();
 var full=active().length*S.contrib;
 var m=S.mem[r];m.got=true;
 var text=fill(U("payTx"),r,r,r);
 if(S.pot<full*0.85){T(r,-8);text+=" "+fill(U("short"),r,r,r);}else T(r,12);
 active().forEach(function(i){if(i!==r)T(i,S.mem[i].got?-1:-2);});
 var fee=FEE*active().length;C(fee);
 // départs
 var gone=[];
 S.mem.forEach(function(x,i){if(!x.left&&x.trust<=10){x.left=true;gone.push(i);}});
 gone.forEach(function(i){text+="\n"+fill(U("left"),i,i,i);ALL(-4);});
 S.lastRes={fr:text,en:text};S.fxl=diffs(before);
 S.phase="pay";beep(880,.3);vib(40);save();render();
}
function nextWeek(){
 if(active().length<5){S.phase="over";save();render();return;}
 if(S.week>=WEEKS){S.phase="end";var sc=score();if(sc>best())setBest(sc);save();render();return;}
 startWeek();render();
}
function avg(){var a=active();if(!a.length)return 0;var s=0;a.forEach(function(i){s+=S.mem[i].trust;});return s/a.length;}
function score(){
 var a=active().length;
 return Math.round(avg()*0.6+Math.min(100,S.caisse/(S.contrib*8)*100)*0.2+(a/8*100)*0.2);
}
function rankOf(sc){return sc>=85?3:sc>=70?2:sc>=50?1:0;}

}
function render(){
 var h=header(),p=S.phase,a=S.a,b=S.b,r=(S.r0===undefined?S.rcv:S.r0);
 if(p==="intro"){
  h+='<div class="card center"><div class="big">🤝</div><h2>La Tontine</h2><p>'+U("intro1")+'</p><p>'+U("intro2")+'</p><p>'+U("intro3")+'</p><p style="color:var(--mut);font-size:13px">'+U("intro4")+'</p><button class="btn main" onclick="begin()">'+U("start")+'</button>';
  var bs=best();if(bs)h+='<p style="color:var(--mut);font-size:13px">'+U("best")+' : '+bs+'/100</p>';
  h+='</div>'+members();
 }else if(p==="default"){
  h+='<div class="card"><span class="tag">'+U("week")+' '+S.week+'</span><h2>'+fill(U("dfltTx"),S.dfl,S.dfl,r)+'</h2>'+
  btn(0,U("cover"),fill(U("coverS"),0,0,0),S.contrib)+btn(1,U("delay"),U("delayS"))+btn(2,U("press"),U("pressS"))+'</div>'+members();
 }else if(p==="dres"){
  h+='<div class="card"><p>'+fill(L(S.lastRes),S.dfl,S.dfl,r)+'</p>'+fxHtml()+'<button class="btn main" onclick="toEvent()">'+U("cont")+'</button></div>'+members();
 }else if(p==="event"){
  var ev=evById(S.ev);
  h+='<div class="card"><span class="tag">'+U("week")+' '+S.week+'</span><h2>'+fill(L(ev.tx),a,b,r)+'</h2>';
  ev.ch.forEach(function(c,i){h+=btn(i,fill(L(c.l),a,b,r),fill(L(c.s),a,b,r),c.c);});
  h+='</div>'+members();
 }else if(p==="eres"){
  h+='<div class="card"><p>'+fill(L(S.lastRes),a,b,r)+'</p>'+fxHtml()+'<button class="btn main" onclick="toPayout()">'+U("cont")+'</button></div>'+members();
 }else if(p==="pay"){
  h+='<div class="card"><span class="tag">💰 '+U("payout")+'</span><p style="white-space:pre-line">'+L(S.lastRes)+'</p>'+fxHtml()+'<button class="btn main" onclick="nextWeek()">'+U("next")+'</button></div>'+members();
 }else if(p==="end"||p==="over"){
  var sc=score(),rk=rankOf(sc);
  if(p==="over"){h+='<div class="card center"><div class="big">💔</div><h2>'+U("over")+'</h2><p>'+U("overTx")+'</p><button class="btn main" onclick="again()">'+U("again")+'</button></div>'+members();}
  else{
   h+='<div class="card center"><div class="big">'+["😬","👍","🤝","🏆"][rk]+'</div><h2>'+U("end")+'</h2><div class="score">'+sc+'<small style="font-size:22px">/100</small></div><p><b>'+U("ranks")[rk]+'</b></p>'+
   '<p>'+U("avg")+' : '+Math.round(avg())+'% · '+U("members")+' : '+active().length+'/8 · '+U("fundEnd")+' : '+fmt(S.caisse)+' F</p><p style="color:var(--mut)">'+U("best")+' : '+Math.max(best(),sc)+'/100</p>'+
   '<button class="btn main" onclick="share()">'+U("share")+' 📲</button><button class="btn" style="text-align:center" onclick="again()">'+U("again")+'</button></div>'+members();
  }
 }
 $("#app").innerHTML=h;
 document.documentElement.lang=S.lang;
}
function btn(i,l,s,cost){

var SND=true;function beep(f,d){if(!SND)return;try{var A=window.__A||(window.__A=new (window.AudioContext||window.webkitAudioContext)());var o=A.createOscillator(),g=A.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.06;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.stop(A.currentTime+d);}catch(e){}}
