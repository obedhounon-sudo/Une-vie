<html lang="fr"><head>

<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14231f;--mut:#5d7069;--line:#dbe4e1;--p:#0f766e;--p2:#0b5a54;--pl:#e1f2ef;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex:none}
.top h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:.3px}
.ib{background:#ffffff26;border:0;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:15px;font-weight:700}
main{flex:1;overflow-y:auto;padding:12px 14px 96px;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800;font-size:16px;padding:14px;margin:8px 0;text-align:center}
.btn.g{background:var(--pl);color:var(--p2)}
.btn.r{background:#fbe9e7;color:var(--red)}
.btn.s{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:4px 4px 4px 0}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.tab{flex:none;padding:8px 13px;border-radius:20px;background:var(--bg);font-weight:700;font-size:14px;color:var(--mut);white-space:nowrap}
.tab.on{background:var(--p);color:#fff}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:612px;margin:0 auto;background:var(--p2);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;box-shadow:0 6px 18px #0003}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--pl);color:var(--p2);border-radius:16px;padding:6px 11px;font-size:13px;font-weight:700}
.h{font-weight:800;font-size:17px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.item{border-left:4px solid var(--p);padding-left:10px;margin:10px 0}
.pv{background:#cfd8d5;padding:10px 0}
.pv canvas{display:block;width:100%;height:auto;margin:0 auto 12px;box-shadow:0 2px 10px #0003;background:#fff;max-width:640px}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px 6px 4px 0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.tpl{flex:1;white-space:nowrap;padding-left:10px!important;padding-right:10px!important;border:2px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-weight:800;font-size:14px;background:#fff}
.tpl.on{border-color:var(--p);background:var(--pl);color:var(--p2)}
.photo{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--pl);border:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14231fe6;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.cvrow{display:flex;align-items:center;gap:10px}
.cvrow .grow{flex:1;min-width:0}
.cvrow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:34px;font-weight:900;color:var(--p);text-align:center;margin:20px 0 4px}
</style></head><body>
<div id="app"></div>
<script>
"use strict";
/* ================== Langue de l'interface ================== */
var LANG=(navigator.language||"fr").slice(0,2)==="en"?"en":"fr";
try{var _l=localStorage.getItem("cv_ui");if(_l)LANG=_l;}catch(e){}
function X(fr,en){return LANG==="fr"?fr:en;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(s){return document.querySelector(s);}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ================== Données ================== */
var SAVE={list:[],cur:null};
try{var _s=JSON.parse(localStorage.getItem("cv_v1"));if(_s&&_s.list)SAVE=_s;}catch(e){}
var saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem("cv_v1",JSON.stringify(SAVE));}catch(e){toast(X("Mémoire pleine : retire la photo","Storage full: remove the photo"));}},250);}
function blank(){return {id:uid(),upd:Date.now(),cl:LANG,tpl:"modern",color:"#0f766e",photo:"",name:"",title:"",email:"",phone:"",city:"",link:"",birth:"",summary:"",exp:[],edu:[],skills:"",langs:[],interests:"",refs:[],custom:[]};}
function example(){var d=blank();d.cl=LANG;
 d.name="Afi Mensah";d.title=X("Assistante commerciale","Sales assistant");d.email="afi.mensah@exemple.com";d.phone="+228 90 12 34 56";d.city="Lomé, Togo";d.link="";
 d.summary=X("Assistante commerciale motivée, à l'aise avec la clientèle et les outils numériques. Je cherche un poste où je peux vendre, conseiller et faire grandir une équipe.","Motivated sales assistant, comfortable with customers and digital tools. I am looking for a role where I can sell, advise and help a team grow.");
 d.exp=[{role:X("Vendeuse","Sales associate"),org:"Boutique Mode Plus",place:"Lomé",from:"2023",to:"2024",desc:X("- Accueil et conseil de plus de 40 clients par jour\n- Tenue de la caisse et du stock sans écart\n- Augmentation des ventes de 15 % grâce à WhatsApp Business","- Welcomed and advised 40+ customers a day\n- Ran the till and stock with no discrepancy\n- Raised sales by 15% through WhatsApp Business")},
  {role:X("Stagiaire administrative","Admin intern"),org:"Cabinet Agbodjan",place:"Lomé",from:"2022",to:"2022",desc:X("- Classement et saisie de dossiers clients\n- Préparation de factures et de courriers","- Filed and entered client records\n- Prepared invoices and letters")}];
 d.edu=[{degree:X("BTS Commerce International","Higher diploma in International Trade"),school:"Université de Lomé",place:"Lomé",from:"2021",to:"2023",desc:""},{degree:X("Baccalauréat série G2","High school diploma (G2)"),school:"Lycée de Tokoin",place:"Lomé",from:"2018",to:"2020",desc:""}];
 d.skills=X("Relation client\nVente et négociation\nExcel et Word\nWhatsApp Business\nGestion de caisse","Customer service\nSales & negotiation\nExcel and Word\nWhatsApp Business\nCash handling");
 d.langs=[{n:X("Français","French"),l:4},{n:X("Anglais","English"),l:2},{n:"Éwé",l:4}];
 d.interests=X("Lecture\nCouture\nBénévolat","Reading\nSewing\nVolunteering");return d;}
function cur(){for(var i=0;i<SAVE.list.length;i++)if(SAVE.list[i].id===SAVE.cur)return SAVE.list[i];return null;}
var CV=null,TAB=0,VIEW="home";

/* ================== Aides de rédaction ================== */
var PROFILES=[
 [["Jeune diplômé(e)","Fresh graduate"],"Jeune diplômé(e) en {t}, rigoureux(se) et motivé(e). Je souhaite mettre mes compétences au service d'une entreprise dynamique et progresser rapidement.","Motivated and rigorous graduate in {t}. I want to put my skills at the service of a dynamic company and grow quickly."],
 [["Avec expérience","Experienced"],"{t} avec plusieurs années d'expérience, habitué(e) à travailler en équipe et à atteindre des objectifs. Fiable, organisé(e) et orienté(e) résultats.","{t} with several years of experience, used to teamwork and hitting targets. Reliable, organised and results-driven."],
 [["Commerce / vente","Sales"],"{t} au contact facile, à l'écoute des clients et efficace pour conclure une vente. Sens du service et de la négociation.","{t} with an easy manner, a good listener and effective at closing sales. Strong service and negotiation skills."],
 [["Reconversion","Career change"],"Après plusieurs années dans un autre domaine, je me réoriente vers le métier de {t}. Adaptable, curieux(se) et prêt(e) à apprendre vite.","After several years in another field, I am moving into {t}. Adaptable, curious and ready to learn fast."],
 [["Recherche de stage","Internship"],"Étudiant(e) à la recherche d'un stage de {t}. Motivé(e), sérieux(se) et désireux(se) d'apprendre sur le terrain.","Student looking for a {t} internship. Motivated, serious and eager to learn on the job."]
];
var VERBS=[["Gérer","Organiser","Coordonner","Vendre","Développer","Former","Améliorer","Réaliser","Accueillir","Analyser","Rédiger","Négocier","Animer","Contrôler"],["Managed","Organised","Coordinated","Sold","Developed","Trained","Improved","Delivered","Welcomed","Analysed","Wrote","Negotiated","Led","Monitored"]];
var LVL=[["Notions","Intermédiaire","Courant","Bilingue","Langue maternelle"],["Basic","Intermediate","Fluent","Bilingual","Native"]];
var SEC={profile:["Profil","Profile"],exp:["Expérience professionnelle","Work experience"],edu:["Formation","Education"],skills:["Compétences","Skills"],langs:["Langues","Languages"],interests:["Centres d'intérêt","Interests"],refs:["Références","References"],contact:["Contact","Contact"],present:["Présent","Present"],birth:["Né(e) le ","Born "]};
function S(d,k){return SEC[k][d.cl==="en"?1:0];}
var COLORS=["#0f766e","#1f6feb","#b91c1c","#7c3aed","#c2410c","#15803d","#111827"];

/* ================== Moteur de rendu (canvas A4 150 dpi) ================== */
var PW=1240,PH=1754,SANS='Roboto,"Helvetica Neue",Arial,sans-serif',SERIF='Georgia,"Times New Roman",serif';
var K=1;
function newPage(){var c=document.createElement("canvas");c.width=PW;c.height=PH;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,PW,PH);x.textBaseline="alphabetic";return {c:c,x:x,t:[]};}
function fnt(sz,w,fam,it){return (it?"italic ":"")+(w||400)+" "+sz+"px "+fam;}
function wrapText(x,text,maxW){var out=[];String(text==null?"":text).split("\n").forEach(function(par){if(!par.trim()){out.push("");return;}var words=par.trim().split(/\s+/),line="";words.forEach(function(w){var t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});out.push(line);});return out;}
function Flow(page,o){this.p=page;this.x0=o.x;this.w=o.w;this.y=o.y;this.top=o.top||o.y;this.bottom=o.bottom;this.onPage=o.onPage||null;}
Flow.prototype.brk=function(){if(!this.onPage)return false;this.p=this.onPage();this.y=this.top;return true;};
Flow.prototype.need=function(h){if(this.y+h*K>this.bottom)return this.brk();return true;};
Flow.prototype.gap=function(n){this.y+=n*K;};
Flow.prototype.text=function(s,o){o=o||{};var sz=Math.round((o.size||27)*(o.raw?1:K)),fam=o.fam||SANS,col=o.color||"#26332f",ctx=this.p.x,indent=o.indent||0,w=this.w-indent-(o.padR||0);
 ctx.font=fnt(sz,o.weight,fam,o.italic);var lines=wrapText(ctx,s,w),lh=Math.round(sz*(o.lh||1.38));
 for(var i=0;i<lines.length;i++){if(this.y+lh>this.bottom){if(!this.brk())return;ctx=this.p.x;}
  ctx.font=fnt(sz,o.weight,fam,o.italic);ctx.fillStyle=col;var tx=this.x0+indent;
  if(o.align==="center"){ctx.textAlign="center";tx=this.x0+this.w/2;}else if(o.align==="right"){ctx.textAlign="right";tx=this.x0+this.w;}else ctx.textAlign="left";
  var t=lines[i];if(o.upper)t=t.toUpperCase();
  if(o.spacing&&ctx.letterSpacing!==undefined)ctx.letterSpacing=o.spacing+"px";
  var tw=ctx.measureText(t).width;this.p.t.push({x:o.align==="center"?tx-tw/2:o.align==="right"?tx-tw:tx,y:this.y+sz,s:t,sz:sz});ctx.fillText(t,tx,this.y+sz);if(ctx.letterSpacing!==undefined)ctx.letterSpacing="0px";ctx.textAlign="left";this.y+=lh;}
 this.y+=(o.after||0)*(o.raw?1:K);};
Flow.prototype.rich=function(s,o){o=o||{};var self=this,sz=Math.round((o.size||26)*K);String(s||"").split("\n").forEach(function(par){
  var m=par.match(/^\s*[-•*]\s+(.*)$/);
  if(m){if(self.y+Math.round(sz*1.38)>self.bottom&&!self.brk())return;var ctx=self.p.x;ctx.fillStyle=o.bullet||o.color||"#26332f";ctx.beginPath();ctx.arc(self.x0+8,self.y+sz*.62,4,0,7);ctx.fill();self.text(m[1],{size:sz,raw:true,fam:o.fam,color:o.color,indent:26,lh:o.lh});}
  else if(par.trim())self.text(par,Object.assign({},o,{size:sz,raw:true}));else self.y+=Math.round(sz*.5);});
 this.y+=(o.after||0)*K;};
Flow.prototype.row=function(left,right,o){o=o||{};var sz=Math.round((o.size||28)*K),fam=o.fam||SANS,ctx=this.p.x;
 ctx.font=fnt(sz,o.weight||700,fam);var rw=right?ctx.measureText(right).width:0;
 var lh=Math.round(sz*1.38);if(this.y+lh*2>this.bottom)this.brk();ctx=this.p.x;
 if(right){ctx.font=fnt(Math.round(sz*.9),400,fam);ctx.fillStyle=o.rcolor||"#5d7069";ctx.textAlign="right";this.p.t.push({x:this.x0+this.w-ctx.measureText(right).width,y:this.y+sz,s:right,sz:Math.round(sz*.9)});ctx.fillText(right,this.x0+this.w,this.y+sz);ctx.textAlign="left";ctx.font=fnt(Math.round(sz*.9),400,fam);rw=ctx.measureText(right).width;}
 this.text(left,{size:sz,raw:true,weight:o.weight||700,fam:fam,color:o.color||"#14231f",padR:rw?rw+24:0,lh:1.3});};
Flow.prototype.rule=function(col,th,gapTop,gapAfter){this.y+=(gapTop||0)*K;var ctx=this.p.x;ctx.fillStyle=col;ctx.fillRect(this.x0,this.y,this.w,th||2);this.y+=(th||2)+(gapAfter||0)*K;};

function skillList(s){return String(s||"").split("\n").map(function(v){return v.trim();}).filter(Boolean);}
function shapePath(ctx,sh,cx,cy,r){ctx.beginPath();if(sh==="square")ctx.rect(cx-r,cy-r,r*2,r*2);else if(sh==="round"){var k=r*.42,x=cx-r,y=cy-r,w=r*2;ctx.moveTo(x+k,y);ctx.arcTo(x+w,y,x+w,y+w,k);ctx.arcTo(x+w,y+w,x,y+w,k);ctx.arcTo(x,y+w,x,y,k);ctx.arcTo(x,y,x+w,y,k);ctx.closePath();}else ctx.arc(cx,cy,r,0,7);}
function drawPhoto(ctx,img,cx,cy,r,sh,bc){sh=sh||"circle";ctx.save();shapePath(ctx,sh,cx,cy,r);ctx.clip();ctx.drawImage(img,cx-r,cy-r,r*2,r*2);ctx.restore();ctx.lineWidth=6;ctx.strokeStyle=bc||"#ffffff";shapePath(ctx,sh,cx,cy,r);ctx.stroke();}
function entries(fl,d,list,kind,st){
 list.forEach(function(e){
  var left=kind==="exp"?e.role:e.degree,sub=[kind==="exp"?e.org:e.school,e.place].filter(Boolean).join(" · "),dates=(e.from&&e.to&&e.from===e.to)?e.from:[e.from,e.to?e.to:(e.from?S(d,"present"):"")].filter(Boolean).join(" – ");
  if(!left&&!sub&&!e.desc)return;
  fl.need(150);fl.row(left||sub,dates,{size:st.esz,fam:st.fam,color:"#14231f"});
  if(left&&sub)fl.text(sub,{size:st.bsz,fam:st.fam,italic:true,color:st.sub});
  if(e.desc){fl.y+=4;fl.rich(e.desc,{size:st.bsz,fam:st.fam,bullet:st.accent});}
  fl.gap(st.egap);});
}
function langText(d,l){return l.n+(l.l!==undefined&&l.l>=0?" ("+LVL[d.cl==="en"?1:0][l.l]+")":"");}

function renderCV(d,photoImg){
 var pages=[],tpl=d.tpl,acc=d.color||"#0f766e",T=tpl==="modern"?"m":tpl==="dark"?"d":tpl;
 var pgs=[];
 function mkpage(deco){var p=newPage();pgs.push(p);if(deco)deco(p,pgs.length);return p;}
 var first,main;
 if(T==="m"||T==="d"){
  var SW=410,dk=(T==="d"),sbc=dk?"#1f2937":acc;
  var deco=function(p,n){p.x.fillStyle=sbc;p.x.fillRect(0,0,SW,PH);if(dk){p.x.fillStyle=acc;p.x.fillRect(SW-10,0,10,PH);}};
  first=mkpage(deco);
  /* colonne gauche */
  var sb=new Flow(first,{x:48,w:SW-96,y:70,bottom:PH-60});
  if(d.photo&&photoImg){drawPhoto(first.x,photoImg,SW/2,160,100,d.shape,T==="d"?acc:"#ffffff");sb.y=290;}
  function sh(t){sb.gap(22);sb.text(t,{size:25,weight:800,color:"#ffffff",upper:true,spacing:2,after:6});sb.rule("#ffffff80",2,0,14);}
  if(dk){sb.text(d.name||X("Ton nom","Your name"),{size:44,weight:900,color:"#ffffff",lh:1.1,after:6});if(d.title)sb.text(d.title,{size:27,weight:700,color:acc==="#111827"?"#cbd5e1":"#ffffff",after:6});}
  var contact=[];
  if(d.phone)contact.push("📞 "+d.phone);if(d.email)contact.push("✉ "+d.email);if(d.city)contact.push("📍 "+d.city);if(d.link)contact.push("🔗 "+d.link);if(d.birth)contact.push("🎂 "+d.birth);
  if(contact.length){sh(S(d,"contact"));contact.forEach(function(c){sb.text(c,{size:24,color:"#ffffff",after:8});});}
  var sk=skillList(d.skills);if(sk.length){sh(S(d,"skills"));sk.forEach(function(s){sb.text("• "+s,{size:24,color:"#ffffff",after:6,indent:0});});}
  if(d.langs.length){sh(S(d,"langs"));d.langs.forEach(function(l){if(!l.n)return;sb.text(l.n,{size:24,weight:700,color:"#ffffff"});var ctx=first.x,bw=sb.w;ctx.fillStyle="#ffffff40";ctx.fillRect(sb.x0,sb.y+2,bw,10);ctx.fillStyle="#ffffff";ctx.fillRect(sb.x0,sb.y+2,bw*((l.l+1)/5),10);sb.y+=26;});}
  var it=skillList(d.interests);if(it.length){sh(S(d,"interests"));it.forEach(function(s){sb.text("• "+s,{size:24,color:"#ffffff",after:6});});}
  /* colonne principale */
  var ML=SW+58,MW=PW-ML-66;
  main=new Flow(first,{x:ML,w:MW,y:80,top:70,bottom:PH-70,onPage:function(){return mkpage(deco);}});
  if(!dk){main.text(d.name||X("Ton nom","Your name"),{size:64,weight:900,color:"#14231f",lh:1.1});
  if(d.title)main.text(d.title,{size:32,weight:700,color:acc,after:10});}
  var st={esz:29,bsz:26,fam:SANS,sub:"#5d7069",accent:acc,egap:20};
  var secM=function(t){main.need(120);main.gap(14);if(dk){main.text(t,{size:27,weight:900,color:"#1f2937",upper:true,spacing:3});main.rule(acc,6,2,14);}else{main.text(t,{size:27,weight:800,color:acc,upper:true,spacing:2});main.rule(acc,3,2,14);}};
  if(d.summary){secM(S(d,"profile"));main.rich(d.summary,{size:26,after:6});}
  if(d.exp.length){secM(S(d,"exp"));entries(main,d,d.exp,"exp",st);}
  if(d.edu.length){secM(S(d,"edu"));entries(main,d,d.edu,"edu",st);}
  d.custom.forEach(function(c){if(!c.t&&!c.tx)return;secM(c.t||"");main.rich(c.tx,{size:26,bullet:acc,after:8});});
  if(d.refs.length){secM(S(d,"refs"));d.refs.forEach(function(r){if(!r.n)return;main.need(90);main.text(r.n,{size:27,weight:700});main.text([r.role,r.contact].filter(Boolean).join(" · "),{size:25,color:"#5d7069",after:10});});}
 }else if(T==="band"){
  var bd=function(p,n){if(n===1){p.x.fillStyle=acc;p.x.fillRect(0,0,PW,290);}};
  first=mkpage(bd);
  var hx=new Flow(first,{x:80,w:PW-160-(d.photo&&photoImg?200:0),y:62,bottom:290});
  hx.text(d.name||X("Ton nom","Your name"),{size:68,weight:900,color:"#ffffff",lh:1.08});
  if(d.title)hx.text(d.title,{size:32,weight:600,color:"#ffffffdd",after:10});
  hx.text([d.phone,d.email,d.city,d.link].filter(Boolean).join("   •   "),{size:23,color:"#ffffffee",lh:1.3});
  if(d.photo&&photoImg)drawPhoto(first.x,photoImg,PW-80-90,145,90,d.shape,"#ffffff");
  var LX=80,LW=260,CX=380,CW=PW-CX-80;
  main=new Flow(first,{x:CX,w:CW,y:340,top:80,bottom:PH-80,onPage:function(){return mkpage(bd);}});
  var secB=function(t){main.need(150);main.gap(10);var y0=main.y,tf=new Flow(main.p,{x:LX,w:LW,y:y0,bottom:PH-60});tf.text(t,{size:21,weight:900,color:acc,upper:true,spacing:1,lh:1.2});};
  var stB={esz:28,bsz:25,fam:SANS,sub:"#5d7069",accent:acc,egap:18};
  if(d.summary){secB(S(d,"profile"));main.rich(d.summary,{size:26,after:12});}

 t=t.replace(/\s+([,.;:!?])/g,"$1").replace(/([,.;:!?])\1+/g,"$1").replace(/[.;]+$/,"");

function pickPhoto(inp){var f=inp.files&&inp.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext("2d").drawImage(im,0,0,c.width,c.height);CV.photoSrc=c.toDataURL("image/jpeg",0.82);CV.pz=1;CV.px=0;CV.py=0;if(!CV.shape)CV.shape="circle";CV.bw=false;cropEditor();};im.onerror=function(){toast(X("Image illisible","Unreadable image"));};im.src=fr.result;};fr.readAsDataURL(f);}

function cropDraw(ctx,img,size){var w=img.width,h=img.height,z=CV.pz||1,sd=Math.min(w,h)/z,sx=(w-sd)/2+(CV.px||0)*(w-sd)/2,sy=(h-sd)/2+(CV.py||0)*(h-sd)/2;sx=Math.max(0,Math.min(w-sd,sx));sy=Math.max(0,Math.min(h-sd,sy));ctx.drawImage(img,sx,sy,sd,sd,0,0,size,size);

function letterGen(){
 var d=CV,L=d.letter||(d.letter={}),en=d.cl==="en",st=skillList(d.skills).slice(0,3),exp=d.exp[0];
 var job=L.job||d.title||(en?"[position]":"[poste]"),co=L.co||(en?"your company":"votre entreprise");
 var past=exp&&exp.to&&exp.to!==""&&exp.to.toLowerCase()!==S(d,"present").toLowerCase();
 var who=exp&&exp.role?(en?(past?"I most recently worked as ":"I currently work as ")+exp.role+(exp.org?" at "+exp.org:"")+". ":(past?"J'ai récemment occupé le poste de ":"Actuellement en poste comme ")+exp.role+(exp.org?" chez "+exp.org:"")+". "):"";
 var t;
 if(en){t=(L.to||"Dear Sir or Madam")+",\n\n"+who+"I am writing to apply for the position of "+job+" at "+co+".\n\n"+(L.why||"Your company's reputation and projects motivate me, and I am convinced my skills and seriousness would be a real asset to your team.")+"\n\n"+(st.length?"My main strengths:\n"+st.map(function(x){return "- "+x;}).join("\n")+"\n\n":"")+"I would be glad to discuss my application in an interview at your convenience. Thank you for your time and consideration.\n\nYours faithfully,\n"+(d.name||"");}
 else{t=(L.to||"Madame, Monsieur")+",\n\n"+who+"Je vous adresse ma candidature pour le poste de "+job+" au sein de "+co+".\n\n"+(L.why||"Votre entreprise et ses projets me motivent, et je suis convaincu(e) que mon sérieux et mes compétences seraient un véritable atout pour votre équipe.")+"\n\n"+(st.length?"Mes principaux atouts :\n"+st.map(function(x){return "- "+x;}).join("\n")+"\n\n":"")+"Disponible pour un entretien à votre convenance, je vous remercie de l'attention portée à ma candidature et vous prie d'agréer, Madame, Monsieur, mes salutations distinguées.\n\n"+(d.name||"");}
 L.body=t;persist();letter();
}

 shell(X("Lettre","Letter"),'<button class="ib" onclick="editor()">←</button>',h);

function renderLetter(d){
 var L=d.letter||{},pg=[];var p=newPage();pg.push(p);var M=120;
 var fl=new Flow(p,{x:M,w:PW-2*M,y:110,top:110,bottom:PH-110,onPage:function(){var q=newPage();pg.push(q);return q;}});
 fl.text(d.name||"",{size:34,weight:800,color:"#14231f",raw:true});
 [d.phone,d.email,d.city].filter(Boolean).forEach(function(c){fl.text(c,{size:26,color:"#5d7069",raw:true});});
 fl.gap(30);
 var dt=new Date().toLocaleDateString(d.cl==="en"?"en-GB":"fr-FR",{day:"numeric",month:"long",year:"numeric"});
 fl.text((d.city?d.city.split(",")[0]+", ":"")+dt,{size:26,align:"right",raw:true,after:30});
 if(L.co)fl.text(L.co,{size:29,weight:700,raw:true,after:20});
 fl.text((d.cl==="en"?"Subject: Application for ":"Objet : Candidature au poste de ")+(L.job||d.title||""),{size:28,weight:800,color:acc(d),raw:true,after:26});
 fl.rich(L.body||"",{size:28,bullet:acc(d),raw:true});
 return pg.map(function(x){x.c.__t=x.t;return x.c;});
}
function acc(d){return d.color||"#0f766e";}

}
