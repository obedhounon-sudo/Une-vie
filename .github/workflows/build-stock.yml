name: Compiler Stock Express
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stock/**'
      - '.github/workflows/build-stock.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: stock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Ranger les fichiers
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          cp splash.png assets/splash-dark.png

      - name: Installer les outils
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Pubs Unity Ads (module Android)
        run: |
          D=android/app/src/main/java/com/obedklein/stockexpress
          ls $D
          for f in UnityAdsPlugin MainActivity; do sed 's/com.obedklein.uneviejeu/com.obedklein.stockexpress/' ../android-plugin/$f.java > $D/$f.java; done
          sed -i '/AdmobPlugin/d' $D/MainActivity.java
          python3 - <<'PY'
          p='android/app/build.gradle'; s=open(p).read()
          dep="    implementation 'com.unity3d.ads:unity-ads:4.+'\n"
          if 'unity-ads' not in s:
              i=s.index('dependencies {', s.index('android {'))+len('dependencies {')
              s=s[:i]+'\n'+dep+s[i:]
          open(p,'w').write(s)
          PY
          grep -n "unity-ads" android/app/build.gradle
          cat $D/MainActivity.java

      - name: Numéro de version
        run: |
          F=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $F
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $F
          grep -n "versionCode\|versionName" $F

      - name: Compiler l'APK
        working-directory: stock/android
        run: |
          sed -i 's/networkTimeout=[0-9]*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties || true
          for i in 1 2 3 4; do ./gradlew assembleRelease assembleDebug --no-daemon && exit 0; echo "Tentative $i échouée, nouvel essai..."; sleep 20; done; exit 1

      - name: Signer l'APK
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNS=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNS" aligned.apk
          $BT/apksigner sign --ks upload.jks --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out stock-express-1.0.${{ github.run_number }}.apk aligned.apk
          $BT/apksigner verify stock-express-1.0.${{ github.run_number }}.apk
          rm upload.jks

      - name: APK de secours (non signé par la clé officielle)
        if: env.HAS_KEY != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk stock-express-1.0.${{ github.run_number }}.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "stock-${{ github.run_number }}" stock-express-1.0.${{ github.run_number }}.apk --title "Stock Express 1.0.${{ github.run_number }}" --notes "Installez stock-express-1.0.${{ github.run_number }}.apk sur votre téléphone Android." --target "${{ github.sha }}"
