name: Signature Android — procédure manuelle sécurisée
on:
  workflow_dispatch:
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Sécurité
        run: |
          {
            echo "## Génération de la clé de signature"
            echo
            echo "Ce workflow ne génère et ne publie plus de clé privée."
            echo "L'ancien workflow plaçait le keystore et son mot de passe dans le même artefact téléchargeable."
            echo "Générez la clé sur un appareil de confiance, conservez une sauvegarde chiffrée hors du dépôt,"
            echo "puis enregistrez séparément KEYSTORE_BASE64, KEYSTORE_PASSWORD et KEY_ALIAS dans Settings > Secrets and variables > Actions."
            echo "Ne placez jamais le keystore ou son mot de passe dans le dépôt, les logs ou un artefact partagé."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Aucune clé n'a été générée."
