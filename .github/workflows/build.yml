name: Compiler l'application
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Ranger les fichiers
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          cp splash.png assets/splash-dark.png

      - name: Installer les outils
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Numéro de version
        run: |
          F=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $F
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $F
          grep -n "versionCode\|versionName" $F

      - name: APK de test Une Vie (à installer sur votre téléphone)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: une-vie-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK de test Une Vie dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk une-vie-test.apk
          gh release create "test-${{ github.run_number }}" une-vie-test.apk --title "APK de test Une Vie ${{ github.run_number }}" --notes "Installez une-vie-test.apk sur votre téléphone Android." --target "${{ github.sha }}"

      - name: Signer le paquet
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > ../upload.jks
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore ../upload.jks -storepass "$KEYSTORE_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -2
          cp "$AAB" ../une-vie-signe.aab
          rm ../upload.jks
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: une-vie-play-store-aab
          path: une-vie-signe.aab
