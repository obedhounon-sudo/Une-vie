<title>Reçus Scolaires</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concept: un registre de caisse d'école. Papier froid, encre bleu nuit, reçu imprimable en papier blanc. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#14202b; --muted:#5b6977; --line:#d6dce2;
  --accent:#0f5c7a; --accent-ink:#ffffff; --soft:#e3eef3;
  --late-bg:#fbe3e1;--ok:#1b7a4a; --ok-bg:#e0f2e8; --warn:#a8531a; --warn-bg:#fbebdd; --bad:#b3261e;
  --paper:#ffffff; --paper-ink:#14202b; --paper-line:#c9d0d7;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --ink:#e8eef3; --muted:#93a1ae; --line:#2b3947;
  --accent:#5bb4d6; --accent-ink:#06222e; --soft:#1d2e3a;
  --ok:#5fcf93; --ok-bg:#16301f; --warn:#f0a56a; --warn-bg:#3a2515; --bad:#ff8a80; --late-bg:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --ink:#e8eef3; --muted:#93a1ae; --line:#2b3947;
  --accent:#5bb4d6; --accent-ink:#06222e; --soft:#1d2e3a;
  --ok:#5fcf93; --ok-bg:#16301f; --warn:#f0a56a; --warn-bg:#3a2515; --bad:#ff8a80; --late-bg:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:760px;margin:0 auto;padding-block:16px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px}
.brand{min-width:0}
.brand small{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.brand h1{font-size:1.3rem;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:110px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
.logoprev{max-height:72px;max-width:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .name{font-weight:600;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.none{background:var(--soft);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-weight:600}
.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:60;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,25,.6);z-index:50;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px 20px;font-size:.95rem;border:1px solid var(--paper-line)}
.receipt .head{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.receipt .head .hd{min-width:0}
.receipt .head .logo{max-height:64px;max-width:84px;object-fit:contain}
.receipt .head h2{font-size:1.25rem;overflow-wrap:anywhere}
.receipt .head div{font-size:.85rem}
.receipt .title{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.receipt .title b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.06em}
.receipt .title span{font-family:var(--f-mono);font-size:.85rem}
.receipt dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.receipt dt{color:#55626f} .receipt dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.receipt .amount{margin:14px 0;border:2px solid var(--paper-ink);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.receipt .amount b{font-family:var(--f-mono);font-size:1.35rem}
.receipt .words{font-size:.85rem;font-style:italic;margin-bottom:12px}
.receipt .foot{display:flex;gap:14px;align-items:center;margin-top:16px}
.receipt .qr{flex:none;line-height:0;border:1px solid var(--paper-line);border-radius:4px}
.receipt .ctl{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:#55626f}
.receipt .ctl b{font-family:var(--f-mono);font-size:1.1rem;color:var(--paper-ink);letter-spacing:.12em}
.receipt .sign{display:flex;justify-content:space-between;gap:20px;margin-top:18px;font-size:.82rem;color:#55626f}
.receipt .sign div{flex:1;border-top:1px solid var(--paper-line);padding-top:4px;text-align:center}
@media print{
  body.rc .app,body.rc .toast,.noprint{display:none!important}
  body.rc{background:#fff;padding:0}
  body.rc .modal-bg{position:static;background:none;padding:0;overflow:visible}
  body.rc .receipt{border:1px solid #999}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
.pill.late{background:var(--late-bg);color:var(--bad)}
.lock{max-width:380px;margin:12vh auto 0}
.lock h1{font-size:1.4rem}
.receipt.fmt-a4{max-width:none}
.receipt.fmt-ticket{max-width:290px;margin:0 auto;padding:12px;font-size:.78rem}
.receipt.fmt-ticket .head .logo{max-height:36px;max-width:56px}
.receipt.fmt-ticket .head h2{font-size:1rem}
.receipt.fmt-ticket .amount b{font-size:1rem}
.receipt.fmt-ticket .foot{flex-direction:column;text-align:center}
.receipt.void{position:relative;overflow:hidden}
.receipt.void::after{content:"ANNULÉ";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 3.6rem var(--f-display);color:rgba(179,38,30,.26);transform:rotate(-18deg);pointer-events:none}
.voidbar{background:#fbe3e1;color:#b3261e;font-weight:700;font-size:.85rem;padding:8px 10px;border-radius:4px;margin-bottom:12px}
.back{display:block;text-align:left}
.side{display:none}
.sidebtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--fg);min-height:42px}
.sidebtn:hover{background:var(--soft)}
.sidebtn[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.sidebtn[aria-current="true"] .muted{color:inherit}
.side h3{margin:18px 12px 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
@media (min-width:960px){
  .app{max-width:1180px}
  .split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
  .side{display:block;position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;max-height:calc(100vh - 24px);overflow:auto}
  .tabs{display:none}
  .stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .form{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
}
.signature{margin-top:28px;text-align:center;color:var(--muted);font-size:.85rem}
.signature a{color:var(--accent);font-weight:700;text-decoration:none}
.receipt .credit{margin-top:12px;text-align:center;font-size:.72rem;color:#7a8794}
.receipt.report h3{margin:14px 0 6px;font-size:1rem}
.receipt.report table{width:100%;border-collapse:collapse;font-size:.88rem}
.receipt.report td{padding:5px 4px;border-bottom:1px solid var(--paper-line);overflow-wrap:anywhere}
.receipt.report td.r{text-align:right}
</style>

<script>
/* Générateur de QR code (octets, niveaux L/M, versions 1 à 10). */
var QR=(function(){
var ECC={L:{fmt:1,per:[7,10,15,20,26,18,20,24,30,18],blk:[1,1,1,1,1,2,2,2,2,4]},M:{fmt:0,per:[10,16,26,18,24,16,18,22,22,26],blk:[1,1,1,2,2,4,4,4,5,5]}};

function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>7)*0x11D);z^=((y>>i)&1)*x}return z}
function divisor(d){var r=[];for(var i=0;i<d;i++)r.push(0);r[d-1]=1;var root=1;for(i=0;i<d;i++){for(var j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
function remainder(data,div){var r=div.map(function(){return 0});data.forEach(function(b){var f=b^r.shift();r.push(0);div.forEach(function(c,i){r[i]^=mul(c,f)})});return r}
function utf8(s){var o=[],e=unescape(encodeURIComponent(s));for(var i=0;i<e.length;i++)o.push(e.charCodeAt(i));return o}
function bit(x,i){return((x>>>i)&1)!==0}
function make(text){
  var bytes=utf8(text),lv=null,ver=0,e;
  outer:for(var L=["M","L"],k=0;k<2;k++){e=ECC[L[k]];for(var v=1;v<=10;v++){var cap=Math.floor(raw(v)/8)-e.per[v-1]*e.blk[v-1];if(4+(v<10?8:16)+bytes.length*8<=cap*8){lv=L[k];ver=v;break outer}}}
  if(!ver)throw new Error("Texte trop long pour le QR");
  e=ECC[lv];var size=ver*4+17,nb=e.blk[ver-1],eccLen=e.per[ver-1],rawCw=Math.floor(raw(ver)/8),dataCw=rawCw-eccLen*nb;
  var bits=[];function put(v,n){for(var i=n-1;i>=0;i--)bits.push((v>>>i)&1)}

  var capBits=dataCw*8;put(0,Math.min(4,capBits-bits.length));while(bits.length%8)bits.push(0);
  for(var pad=0xEC;bits.length<capBits;pad^=0xEC^0x11)put(pad,8);
  var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
  var shortLen=Math.floor(rawCw/nb),nShort=nb-rawCw%nb,div=divisor(eccLen),blocks=[],off=0;
  for(i=0;i<nb;i++){var dl=shortLen-eccLen+(i<nShort?0:1),d=data.slice(off,off+dl);off+=dl;var ecc=remainder(d,div);if(i<nShort)d.push(0);blocks.push(d.concat(ecc))}
  var all=[];for(i=0;i<blocks[0].length;i++)blocks.forEach(function(bl,j){if(i!==shortLen-eccLen||j>=nShort)all.push(bl[i])});
  var M=[],F=[];for(i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
  function setF(x,y,c){M[y][x]=c;F[y][x]=true}
  for(i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
  function finder(x,y){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var dist=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)setF(xx,yy,dist!==2&&dist!==4)}}
  finder(3,3);finder(size-4,3);finder(3,size-4);
  var pos=[];if(ver>1){var na=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(na*2-2))*2;pos=[6];for(var p=size-7;pos.length<na;p-=step)pos.splice(1,0,p)}
  pos.forEach(function(a,ia){pos.forEach(function(b,ib){if((ia===0&&ib===0)||(ia===0&&ib===pos.length-1)||(ia===pos.length-1&&ib===0))return;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)setF(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)})});
  function fmt(mask){var d=(e.fmt<<3)|mask,r=d;for(var i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);var bs=((d<<10)|r)^0x5412;
    for(i=0;i<=5;i++)setF(8,i,bit(bs,i));setF(8,7,bit(bs,6));setF(8,8,bit(bs,7));setF(7,8,bit(bs,8));for(i=9;i<15;i++)setF(14-i,8,bit(bs,i));
    for(i=0;i<8;i++)setF(size-1-i,8,bit(bs,i));for(i=8;i<15;i++)setF(8,size-15+i,bit(bs,i));setF(8,size-8,true)}
  fmt(0);
  if(ver>=7){var r=ver;for(i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);var vb=(ver<<12)|r;for(i=0;i<18;i++){var c=bit(vb,i),a=size-11+i%3,b2=Math.floor(i/3);setF(a,b2,c);setF(b2,a,c)}}
  var n=0;for(var right=size-1;right>=1;right-=2){if(right===6)right=5;for(var vert=0;vert<size;vert++)for(j=0;j<2;j++){var x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&n<all.length*8){M[y][x]=bit(all[n>>>3],7-(n&7));n++}}}
  function mask(m){for(var y=0;y<size;y++)for(var x=0;x<size;x++){var inv;switch(m){case 0:inv=(x+y)%2===0;break;case 1:inv=y%2===0;break;case 2:inv=x%3===0;break;case 3:inv=(x+y)%3===0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;case 5:inv=x*y%2+x*y%3===0;break;case 6:inv=(x*y%2+x*y%3)%2===0;break;default:inv=((x+y)%2+x*y%3)%2===0}if(!F[y][x]&&inv)M[y][x]=!M[y][x]}}
  function penalty(){var s=0,y,x,run,dark=0;
    for(y=0;y<size;y++){run=1;for(x=1;x<size;x++){if(M[y][x]===M[y][x-1]){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}}
    for(x=0;x<size;x++){run=1;for(y=1;y<size;y++){if(M[y][x]===M[y-1][x]){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}}
    for(y=0;y<size-1;y++)for(x=0;x<size-1;x++){var c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])s+=3}
    for(y=0;y<size;y++)for(x=0;x<size;x++)if(M[y][x])dark++;
    return s+(Math.ceil(Math.abs(dark*20-size*size*10)/(size*size))-1)*10}
  var best=0,bp=1e9;for(var m=0;m<8;m++){mask(m);fmt(m);var pe=penalty();if(pe<bp){bp=pe;best=m}mask(m)}
  mask(best);fmt(best);
  return {size:size,modules:M};
}
function svg(text,px){var q=make(text),s=q.size,z=4,t=s+z*2,d="";
  for(var y=0;y<s;y++)for(var x=0;x<s;x++)if(q.modules[y][x])d+="M"+(x+z)+","+(y+z)+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+(px||120)+'" height="'+(px||120)+'" shape-rendering="crispEdges" role="img" aria-label="QR code du reçu"><rect width="'+t+'" height="'+t+'" fill="#ffffff"/><path d="'+d+'" fill="#000000"/></svg>'}
return {make:make,svg:svg};
})();

"use strict";
var KEY="recus_scolaires_v1",FREE=300,LSALT="RS-2026-k9";

function b100(n,fin){

function b1000(n,fin){

      if(remote&&remote.classes&&remote.students){var wasDemo=db.demo,m=mergeDb(db,remote);m.dev=db.dev;m.seq=wasDemo?0:(db.seq||0);m.lastBackup=db.lastBackup;db=m;migrate();takeSnap();saveLocal()}
      return apiCall("/rest/v1/ecole_saves?on_conflict=user_id","POST",{user_id:AUTH.uid,data:db,updated_at:new Date().toISOString()},tk,{"Prefer":"resolution=merge-duplicates,return=minimal"})})
  }).then(function(){syncState="ok";syncErr="";lastSync=Date.now()}).catch(function(e){syncState="err";syncErr=authErr(e)}).then(function(){
    syncing=null;
    var changed=JSON.stringify(db)!==before;
    if(locked()&&!ui.viaPin&&ui.role){ui.role=null;changed=true}
    var ae=document.activeElement;
    if(ui.role&&(changed||ui.tab==="settings")&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))&&!$("#layer").innerHTML)render();
    else if(!ui.role)render()});
  return syncing}
function schedulePush(){if(!AUTH||!cloudOn())return;clearTimeout(pushTimer);pushTimer=setTimeout(function(){syncNow()},5000)}
document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow()});
setInterval(function(){if(!document.hidden)syncNow()},60000);
function accountCard(){
  if(!cloudOn())return"";
  var h='<div class="card stack"><h3>Compte en ligne (plusieurs appareils)</h3>';

  var up=ui.authMode==="up";
  return h+'<p class="muted small" style="margin:0">Un seul compte pour toute l\'école. Crée-le ici, puis connecte les autres appareils avec le même e-mail.</p><form class="stack" data-form="auth"><label>E-mail<input id="aem" name="email" type="email" autocomplete="email" required></label><label>Mot de passe<input id="apw" name="password" type="password" autocomplete="'+(up?"new-password":"current-password")+'" minlength="6" required></label><button class="btn primary" type="submit">'+(up?"Créer le compte":"Se connecter")+'</button><button class="btn" type="button" data-act="auth-sw">'+(up?"J'ai déjà un compte":"Pas de compte ? Créer un compte")+'</button><div id="amsg" class="small" role="status"></div></form></div>'}

load();migrate();takeSnap();saveLocal();
ui.role=locked()?null:"admin";
render();
})();
