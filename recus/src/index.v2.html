<style>
/* Concept: un registre de caisse d'école. Papier froid, encre bleu nuit, reçu imprimable en papier blanc. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#14202b; --muted:#5b6977; --line:#d6dce2;
  --accent:#0f5c7a; --accent-ink:#ffffff; --soft:#e3eef3;
  --ok:#1b7a4a; --ok-bg:#e0f2e8; --warn:#a8531a; --warn-bg:#fbebdd; --bad:#b3261e;
  --paper:#ffffff; --paper-ink:#14202b; --paper-line:#c9d0d7;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --ink:#e8eef3; --muted:#93a1ae; --line:#2b3947;
  --accent:#5bb4d6; --accent-ink:#06222e; --soft:#1d2e3a;
  --ok:#5fcf93; --ok-bg:#16301f; --warn:#f0a56a; --warn-bg:#3a2515; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --ink:#e8eef3; --muted:#93a1ae; --line:#2b3947;
  --accent:#5bb4d6; --accent-ink:#06222e; --soft:#1d2e3a;
  --ok:#5fcf93; --ok-bg:#16301f; --warn:#f0a56a; --warn-bg:#3a2515; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:760px;margin:0 auto;padding-block:16px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px}
.brand{min-width:0}
.brand small{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.brand h1{font-size:1.3rem;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:110px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
.logoprev{max-height:72px;max-width:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .name{font-weight:600;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.none{background:var(--soft);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-weight:600}
.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:60;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,25,.6);z-index:50;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px 20px;font-size:.95rem;border:1px solid var(--paper-line)}
.receipt .head{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.receipt .head .hd{min-width:0}
.receipt .head .logo{max-height:64px;max-width:84px;object-fit:contain}
.receipt .head h2{font-size:1.25rem;overflow-wrap:anywhere}
.receipt .head div{font-size:.85rem}
.receipt .title{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.receipt .title b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.06em}
.receipt .title span{font-family:var(--f-mono);font-size:.85rem}
.receipt dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.receipt dt{color:#55626f} .receipt dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.receipt .amount{margin:14px 0;border:2px solid var(--paper-ink);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.receipt .amount b{font-family:var(--f-mono);font-size:1.35rem}
.receipt .words{font-size:.85rem;font-style:italic;margin-bottom:12px}
.receipt .foot{display:flex;gap:14px;align-items:center;margin-top:16px}
.receipt .qr{flex:none;line-height:0;border:1px solid var(--paper-line);border-radius:4px}
.receipt .ctl{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:#55626f}
.receipt .ctl b{font-family:var(--f-mono);font-size:1.1rem;color:var(--paper-ink);letter-spacing:.12em}
.receipt .sign{display:flex;justify-content:space-between;gap:20px;margin-top:18px;font-size:.82rem;color:#55626f}
.receipt .sign div{flex:1;border-top:1px solid var(--paper-line);padding-top:4px;text-align:center}
@media print{
  body.rc .app,body.rc .toast,.noprint{display:none!important}
  body.rc{background:#fff;padding:0}
  body.rc .modal-bg{position:static;background:none;padding:0;overflow:visible}
  body.rc .receipt{border:1px solid #999}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<script>
/* Générateur de QR code (octets, niveaux L/M, versions 1 à 10). */
var QR=(function(){
var ECC={L:{fmt:1,per:[7,10,15,20,26,18,20,24,30,18],blk:[1,1,1,1,1,2,2,2,2,4]},M:{fmt:0,per:[10,16,26,18,24,16,18,22,22,26],blk:[1,1,1,2,2,4,4,4,5,5]}};
function raw(v){var r=(16*v+128)*v+64;if(v>=2){var n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>7)*0x11D);z^=((y>>i)&1)*x}return z}
function divisor(d){var r=[];for(var i=0;i<d;i++)r.push(0);r[d-1]=1;var root=1;for(i=0;i<d;i++){for(var j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
function remainder(data,div){var r=div.map(function(){return 0});data.forEach(function(b){var f=b^r.shift();r.push(0);div.forEach(function(c,i){r[i]^=mul(c,f)})});return r}
function utf8(s){var o=[],e=unescape(encodeURIComponent(s));for(var i=0;i<e.length;i++)o.push(e.charCodeAt(i));return o}
function bit(x,i){return((x>>>i)&1)!==0}
function make(text){
  var bytes=utf8(text),lv=null,ver=0,e;
  outer:for(var L=["M","L"],k=0;k<2;k++){e=ECC[L[k]];for(var v=1;v<=10;v++){var cap=Math.floor(raw(v)/8)-e.per[v-1]*e.blk[v-1];if(4+(v<10?8:16)+bytes.length*8<=cap*8){lv=L[k];ver=v;break outer}}}
  if(!ver)throw new Error("Texte trop long pour le QR");
  e=ECC[lv];var size=ver*4+17,nb=e.blk[ver-1],eccLen=e.per[ver-1],rawCw=Math.floor(raw(ver)/8),dataCw=rawCw-eccLen*nb;
  var bits=[];function put(v,n){for(var i=n-1;i>=0;i--)bits.push((v>>>i)&1)}
  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(function(b){put(b,8)});
  var capBits=dataCw*8;put(0,Math.min(4,capBits-bits.length));while(bits.length%8)bits.push(0);
  for(var pad=0xEC;bits.length<capBits;pad^=0xEC^0x11)put(pad,8);
  var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
  var shortLen=Math.floor(rawCw/nb),nShort=nb-rawCw%nb,div=divisor(eccLen),blocks=[],off=0;
  for(i=0;i<nb;i++){var dl=shortLen-eccLen+(i<nShort?0:1),d=data.slice(off,off+dl);off+=dl;var ecc=remainder(d,div);if(i<nShort)d.push(0);blocks.push(d.concat(ecc))}
  var all=[];for(i=0;i<blocks[0].length;i++)blocks.forEach(function(bl,j){if(i!==shortLen-eccLen||j>=nShort)all.push(bl[i])});
  var M=[],F=[];for(i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
  function setF(x,y,c){M[y][x]=c;F[y][x]=true}
  for(i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
  function finder(x,y){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var dist=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)setF(xx,yy,dist!==2&&dist!==4)}}
  finder(3,3);finder(size-4,3);finder(3,size-4);
  var pos=[];if(ver>1){var na=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(na*2-2))*2;pos=[6];for(var p=size-7;pos.length<na;p-=step)pos.splice(1,0,p)}
  pos.forEach(function(a,ia){pos.forEach(function(b,ib){if((ia===0&&ib===0)||(ia===0&&ib===pos.length-1)||(ia===pos.length-1&&ib===0))return;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)setF(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)})});
  function fmt(mask){var d=(e.fmt<<3)|mask,r=d;for(var i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);var bs=((d<<10)|r)^0x5412;
    for(i=0;i<=5;i++)setF(8,i,bit(bs,i));setF(8,7,bit(bs,6));setF(8,8,bit(bs,7));setF(7,8,bit(bs,8));for(i=9;i<15;i++)setF(14-i,8,bit(bs,i));
    for(i=0;i<8;i++)setF(size-1-i,8,bit(bs,i));for(i=8;i<15;i++)setF(8,size-15+i,bit(bs,i));setF(8,size-8,true)}
  fmt(0);
  if(ver>=7){var r=ver;for(i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);var vb=(ver<<12)|r;for(i=0;i<18;i++){var c=bit(vb,i),a=size-11+i%3,b2=Math.floor(i/3);setF(a,b2,c);setF(b2,a,c)}}
  var n=0;for(var right=size-1;right>=1;right-=2){if(right===6)right=5;for(var vert=0;vert<size;vert++)for(j=0;j<2;j++){var x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&n<all.length*8){M[y][x]=bit(all[n>>>3],7-(n&7));n++}}}
  function mask(m){for(var y=0;y<size;y++)for(var x=0;x<size;x++){var inv;switch(m){case 0:inv=(x+y)%2===0;break;case 1:inv=y%2===0;break;case 2:inv=x%3===0;break;case 3:inv=(x+y)%3===0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;case 5:inv=x*y%2+x*y%3===0;break;case 6:inv=(x*y%2+x*y%3)%2===0;break;default:inv=((x+y)%2+x*y%3)%2===0}if(!F[y][x]&&inv)M[y][x]=!M[y][x]}}
  function penalty(){var s=0,y,x,run,dark=0;
    for(y=0;y<size;y++){run=1;for(x=1;x<size;x++){if(M[y][x]===M[y][x-1]){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}}
    for(x=0;x<size;x++){run=1;for(y=1;y<size;y++){if(M[y][x]===M[y-1][x]){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}}
    for(y=0;y<size-1;y++)for(x=0;x<size-1;x++){var c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])s+=3}
    for(y=0;y<size;y++)for(x=0;x<size;x++)if(M[y][x])dark++;
    return s+(Math.ceil(Math.abs(dark*20-size*size*10)/(size*size))-1)*10}
  var best=0,bp=1e9;for(var m=0;m<8;m++){mask(m);fmt(m);var pe=penalty();if(pe<bp){bp=pe;best=m}mask(m)}
  mask(best);fmt(best);
  return {size:size,modules:M};
}
function svg(text,px){var q=make(text),s=q.size,z=4,t=s+z*2,d="";
  for(var y=0;y<s;y++)for(var x=0;x<s;x++)if(q.modules[y][x])d+="M"+(x+z)+","+(y+z)+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+(px||120)+'" height="'+(px||120)+'" shape-rendering="crispEdges" role="img" aria-label="QR code du reçu"><rect width="'+t+'" height="'+t+'" fill="#ffffff"/><path d="'+d+'" fill="#000000"/></svg>'}
return {make:make,svg:svg};
})();

(function(){
"use strict";
var KEY="recus_scolaires_v1";
var $=function(s,r){return (r||document).querySelector(s)};
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function money(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F"}

/* ---------- Montant en lettres ---------- */
var U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
var T=["","","vingt","trente","quarante","cinquante","soixante"];
function b100(n,fin){
  if(n<17)return U[n];
  if(n<20)return "dix-"+U[n-10];
  if(n<70){var t=T[Math.floor(n/10)],u=n%10;return u===0?t:(u===1?t+" et un":t+"-"+U[u])}
  if(n<80){return n===71?"soixante et onze":"soixante-"+b100(n-60,false)}
  if(n===80)return fin?"quatre-vingts":"quatre-vingt";
  return "quatre-vingt-"+b100(n-80,false);
}
function b1000(n,fin){
  var h=Math.floor(n/100),r=n%100;
  if(h===0)return b100(r,fin);
  var s=h===1?"cent":U[h]+" cent";
  if(r===0)return h===1?s:(fin?s+"s":s);
  return s+" "+b100(r,fin);
}
function words(n){
  n=Math.round(n);if(n===0)return "zéro";
  var out=[],m=Math.floor(n/1e6),t=Math.floor((n%1e6)/1000),r=n%1000;
  if(m)out.push(m===1?"un million":b1000(m,false)+" millions");
  if(t)out.push(t===1?"mille":b1000(t,false)+" mille");
  if(r)out.push(b1000(r,true));
  return out.join(" ");
}
function amountWords(n){var w=words(n);return w.charAt(0).toUpperCase()+w.slice(1)+(n>=1e6&&Math.round(n)%1e6===0?" de francs CFA":" francs CFA")}

/* ---------- Données ---------- */
var db=null,ui={view:"home",classId:null,studentId:null,q:"",confirm:null,tab:"home"};
var mem=null;
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){db=JSON.parse(raw);return}}catch(e){}
  if(mem){db=JSON.parse(mem);return}
  db=sample();
}
function save(){
  var s=JSON.stringify(db);mem=s;
  try{localStorage.setItem(KEY,s)}catch(e){}
}
function blank(){return {school:{name:"",year:"2026-2027",city:"",phone:"",logo:""},salt:uid()+uid(),classes:[],students:[],payments:[],seq:0,demo:false}}
function sample(){
  var d=blank();d.demo=true;
  d.school={name:"Collège Les Palmiers (exemple)",year:"2026-2027",city:"Lomé",phone:"90 00 00 00"};
  var c1={id:uid(),name:"6ème",fee:85000},c2={id:uid(),name:"5ème",fee:90000},c3={id:uid(),name:"3ème",fee:110000};
  d.classes=[c1,c2,c3];
  var names={};names[c1.id]=["Afi Mensah","Koffi Agbodjan","Ama Lawson","Komla Dossou"];
  names[c2.id]=["Yao Tchalla","Esso Amegah","Abla Gbeto"];names[c3.id]=["Kodjo Ayivi","Mawuli Sodji"];
  [c1,c2,c3].forEach(function(c){names[c.id].forEach(function(n){d.students.push({id:uid(),classId:c.id,name:n,fee:c.fee,phone:""})})});
  function pay(i,amt,date,mode){var s=d.students[i];var before=d.payments.filter(function(p){return p.studentId===s.id}).reduce(function(a,p){return a+p.amount},0);
    d.seq++;d.payments.push({id:uid(),studentId:s.id,amount:amt,date:date,mode:mode,note:"Scolarité",no:"R-"+date.slice(0,4)+"-"+String(d.seq).padStart(4,"0"),after:before+amt,rest:s.fee-before-amt})}
  pay(0,85000,"2026-09-14","Espèces");pay(1,40000,"2026-09-15","Espèces");pay(1,20000,"2026-10-12","Mobile Money");
  pay(2,30000,"2026-09-20","Espèces");pay(4,90000,"2026-09-16","Mobile Money");pay(5,45000,"2026-10-02","Espèces");pay(7,60000,"2026-10-05","Espèces");
  return d;
}
function ctl(p){var str=[p.no,p.studentId,p.amount,p.date,db.salt].join("|"),h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase().padStart(6,"0").slice(-6)}
function migrate(){if(!db.salt)db.salt=uid()+uid();if(!db.school.logo)db.school.logo="";db.payments.forEach(function(p){if(!p.code)p.code=ctl(p)})}
function cls(id){return db.classes.filter(function(c){return c.id===id})[0]}
function stu(id){return db.students.filter(function(s){return s.id===id})[0]}
function paidOf(sid){return db.payments.filter(function(p){return p.studentId===sid}).reduce(function(a,p){return a+p.amount},0)}
function restOf(s){return Math.max(0,s.fee-paidOf(s.id))}
function status(s){var p=paidOf(s.id);if(p<=0)return ["none","Aucun paiement"];if(p>=s.fee)return ["ok","Soldé"];return ["warn","Reste "+money(s.fee-p)]}
function classStats(c){
  var ss=db.students.filter(function(s){return s.classId===c.id});
  var exp=ss.reduce(function(a,s){return a+s.fee},0),got=ss.reduce(function(a,s){return a+Math.min(paidOf(s.id),s.fee)},0);
  return {n:ss.length,exp:exp,got:got,rest:exp-got,solde:ss.filter(function(s){return paidOf(s.id)>=s.fee}).length}
}

function qrText(p){var r=receiptData(p);return "REÇU N° "+p.no+"\n"+(r.sc.name||"Établissement")+"\n"+r.s.name+(r.c?" ("+r.c.name+")":"")+"\n"+fmtDate(p.date)+"\nVersé : "+p.amount+" F\nReste : "+p.rest+" F\nCode : "+p.code}

/* ---------- Actions ---------- */
function copy(text,ok){
  function fallback(){var ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(ok)}catch(e){toast("Copie impossible")}ta.remove()}
  try{navigator.clipboard.writeText(text).then(function(){toast(ok)},fallback)}catch(e){fallback()}
}
function saveFile(name,text,mime){
  try{var b=new Blob([text],{type:mime}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Fichier prêt. S'il ne se télécharge pas, utilise Copier.")}catch(e){toast("Téléchargement impossible, utilise Copier.")}
}
function csv(){
  var rows=[["N° reçu","Date","Classe","Élève","Montant","Mode","Motif","Total payé","Reste"]];
  db.payments.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(p){var s=stu(p.studentId),c=s?cls(s.classId):null;rows.push([p.no,p.date,c?c.name:"",s?s.name:"",p.amount,p.mode,p.note,p.after,p.rest])});
  return "﻿"+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(";")}).join("\n");
}
function setView(v){ui.view=v;ui.confirm=null;ui.q="";ui.focusQ=false}
function pay(sid,amount,date,mode,note){
  var s=stu(sid),before=paidOf(sid);db.seq++;
  var p={id:uid(),studentId:sid,amount:amount,date:date,mode:mode,note:note||"Scolarité",no:"R-"+date.slice(0,4)+"-"+String(db.seq).padStart(4,"0"),after:before+amount,rest:Math.max(0,s.fee-before-amount)};
  p.code=ctl(p);db.payments.push(p);return p;
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act"),id=el.getAttribute("data-id");
  if(act==="close-bg"){if(e.target===el)closeReceipt();return}
  if(act==="tab"){ui.tab=el.getAttribute("data-v");setView(ui.tab==="home"?"home":"home");render();return}
  if(act==="open-class"){ui.classId=id;ui.tab="home";setView("class");render();window.scrollTo(0,0);return}
  if(act==="open-student"){ui.studentId=id;setView("student");render();window.scrollTo(0,0);return}
  if(act==="close"){closeReceipt();return}
  if(act==="print"){try{window.print()}catch(x){toast("Impression non disponible ici")}return}
  if(act==="receipt"){showReceipt(id);return}
  if(act==="copy-receipt"){copy(receiptText(db.payments.filter(function(p){return p.id===id})[0]),"Reçu copié");return}
  if(act==="wa"){var p=db.payments.filter(function(x){return x.id===id})[0],s=stu(p.studentId),ph=s&&s.phone?s.phone.replace(/\D/g,""):"";
    window.open("https://wa.me/"+(ph.length===8?"228"+ph:ph)+"?text="+encodeURIComponent(receiptText(p)),"_blank");return}
  if(act==="del-pay"){if(ui.confirm==="pay"+id){db.payments=db.payments.filter(function(p){return p.id!==id});save();ui.confirm=null;closeReceipt();render();toast("Paiement supprimé")}else{ui.confirm="pay"+id;showReceipt(id)}return}
  if(act==="del-class"){if(ui.confirm==="del-class"){var ids=db.students.filter(function(s){return s.classId===ui.classId}).map(function(s){return s.id});db.payments=db.payments.filter(function(p){return ids.indexOf(p.studentId)<0});db.students=db.students.filter(function(s){return s.classId!==ui.classId});db.classes=db.classes.filter(function(c){return c.id!==ui.classId});save();setView("home");render();toast("Classe supprimée")}else{ui.confirm="del-class";render()}return}
  if(act==="del-student"){if(ui.confirm==="del-student"){var cid=stu(ui.studentId).classId;db.payments=db.payments.filter(function(p){return p.studentId!==ui.studentId});db.students=db.students.filter(function(s){return s.id!==ui.studentId});save();ui.classId=cid;setView("class");render();toast("Élève supprimé")}else{ui.confirm="del-student";render()}return}
  if(act==="logo-del"){db.school.logo="";save();render();toast("Logo retiré");return}
  if(act==="verify"){var tx=$("#vtxt").value,mn=/R-\d{4}-\d{4}/.exec(tx),mc=/Code\s*:\s*([A-Z0-9]{6})/i.exec(tx),box=$("#vres");
    if(!mn||!mc){box.textContent="Texte non reconnu. Colle le texte complet du QR code.";box.style.color="var(--bad)";return}
    var pp=db.payments.filter(function(x){return x.no===mn[0]})[0];
    if(pp&&pp.code===mc[1].toUpperCase()){var ss=stu(pp.studentId);box.textContent="Reçu authentique : "+(ss?ss.name:"")+", "+money(pp.amount)+", le "+fmtDate(pp.date)+".";box.style.color="var(--ok)"}
    else{box.textContent="Reçu introuvable ou code incorrect. Ce reçu n'a pas été émis par cette caisse.";box.style.color="var(--bad)"}return}
  if(act==="csv"){var t=csv();saveFile("journal-paiements.csv",t,"text/csv");return}
  if(act==="backup-copy"){copy(JSON.stringify(db),"Sauvegarde copiée");return}
  if(act==="backup-file"){saveFile("sauvegarde-recus.json",JSON.stringify(db),"application/json");return}
  if(act==="restore"){try{var d=JSON.parse($("#restore").value);if(!d||!d.classes||!d.students||!d.payments)throw 0;db=d;save();render();toast("Sauvegarde restaurée")}catch(x){toast("Texte de sauvegarde invalide")}return}
  if(act==="wipe"){if(ui.confirm==="wipe"){db=blank();save();setView("home");ui.tab="settings";render();toast("Données effacées")}else{ui.confirm="wipe";render()}return}
  if(act==="clear-demo"){db=blank();save();setView("home");ui.tab="settings";render();toast("Saisis le nom de ton établissement")}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.q=e.target.value;ui.focusQ=true;var c=cls(ui.classId);$("#studlist").innerHTML=studList(c)}
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  var k=f.getAttribute("data-form"),v=function(n){return f.elements[n].value};
  if(k==="add-class"){db.classes.push({id:uid(),name:v("name").trim(),fee:Math.max(0,+v("fee")||0)});db.demo=db.demo;save();render();toast("Classe ajoutée")}
  else if(k==="edit-class"){var c=cls(ui.classId),old=c.fee,nf=Math.max(0,+v("fee")||0);c.name=v("name").trim();c.fee=nf;
    db.students.forEach(function(s){if(s.classId===c.id&&s.fee===old)s.fee=nf});save();render();toast("Classe enregistrée")}
  else if(k==="add-students"){var n=0;v("names").split("\n").forEach(function(line){var p=line.split(";"),nm=p[0].trim();if(!nm)return;db.students.push({id:uid(),classId:ui.classId,name:nm,fee:cls(ui.classId).fee,phone:(p[1]||"").trim()});n++});
    if(n){save();ui.q="";render();toast(n+" élève"+(n>1?"s ajoutés":" ajouté"))}else toast("Écris au moins un nom")}
  else if(k==="pay"){var a=Math.round(+v("amount"));if(!(a>0)){toast("Montant invalide");return}var p=pay(ui.studentId,a,v("date"),v("mode"),v("note").trim());save();render();showReceipt(p.id)}
  else if(k==="edit-student"){var s=stu(ui.studentId);s.name=v("name").trim();s.fee=Math.max(0,+v("fee")||0);s.phone=v("phone").trim();save();render();toast("Élève enregistré")}
  else if(k==="school"){db.school={name:v("name").trim(),year:v("year").trim(),city:v("city").trim(),phone:v("phone").trim()};save();render();toast("Établissement enregistré")}
});
document.addEventListener("change",function(e){
  if(e.target.id!=="logo"||!e.target.files[0])return;
  var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);db.school.logo=c.toDataURL("image/png");save();render();toast("Logo enregistré")};
    im.onerror=function(){toast("Image illisible")};im.src=fr.result};fr.readAsDataURL(e.target.files[0]);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#layer").innerHTML)closeReceipt()});

load();migrate();save();render();
})();
</script>
