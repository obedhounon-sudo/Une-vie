function cap(){var C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?C:null;}
function nativeShare(name,blob){var C=cap(),P=C.Plugins||{},FS=P.Filesystem,SH=P.Share;

 try{var f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(function(){});return;}}catch(x){}

}

/* ---------- fichiers ---------- */

function fname(d,ext){return (TYPES[d.type].n+"-"+d.num+"-"+(d.cn||"")).replace(/[^\wÀ-ÿ-]+/g,"-").replace(/-+/g,"-").replace(/-$/,"")+"."+ext;}
function exportPDF(){toast("Création du PDF…");loadPhoto(BIZ.logo).then(function(lg){var pages=renderDoc(D,lg);window.__lp=pages;return Promise.all(pages.map(function(p){return canvasJpeg(p.c);}));}).then(function(j){saveBlob(fname(D,"pdf"),buildPDF(j,PW,PH,window.__lp.map(function(p){return p.c.__t;})));}).catch(function(){toast("Impossible de créer le PDF");});}
function exportImg(){loadPhoto(BIZ.logo).then(function(lg){var p=renderDoc(D,lg);p[0].c.toBlob(function(b){saveBlob(fname(D,"jpg"),b);},"image/jpeg",0.92);});}
/* ---------- pubs / premium ---------- */
function unlockBox(){var n=adCount(),o=document.createElement("div");o.id="ulk";o.style.cssText="position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px";
 o.innerHTML='<div style="background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center;color:#14213d"><div style="font-size:38px">⭐</div><h2 style="margin:6px 0">Version Premium</h2><p style="color:#5b6478;margin:6px 0 14px">Regarde '+ADS.need+' courtes pubs pour débloquer pour toujours : ton logo, tes couleurs, et la suppression de la mention « Créé avec Facture Express ».</p><div style="font-size:26px;font-weight:800;margin-bottom:12px">'+n+' / '+ADS.need+'</div><button class="btn" id="ulkgo" style="margin:0 0 8px">▶ Regarder une pub</button><button class="btn g" style="margin:0" onclick="document.getElementById(\'ulk\').remove()">Plus tard</button></div>';
 document.body.appendChild(o);document.getElementById("ulkgo").onclick=function(){var b=this;b.disabled=true;b.textContent="…";adsShow().then(function(r){o.remove();if(r.completed){var c=adCount()+1;adSet(c);if(c>=ADS.need){toast("🎉 Premium débloqué !");}else{toast(c+" / "+ADS.need);unlockBox();return;}if(VIEW==="biz")bizScreen();}else if(r.error==="web"){toast("Disponible dans l'application Android");}else{toast("Pub indisponible, réessaie dans un instant");}});};}
/* ---------- écrans ---------- */
function totalOf(d){return calc(d).total;}
function home(){VIEW="home";D=null;
 var h='<main><div class="wrap"><div class="row" style="margin:6px 0"><button class="btn" style="font-size:15px;padding:14px 4px;white-space:nowrap" onclick="newDoc(\'facture\')">＋ Facture</button><button class="btn" style="font-size:15px;padding:14px 4px;white-space:nowrap" onclick="newDoc(\'devis\')">＋ Devis</button><button class="btn" style="font-size:15px;padding:14px 4px;white-space:nowrap" onclick="newDoc(\'recu\')">＋ Reçu</button></div>';
 if(!BIZ.name)h+='<div class="card" style="background:var(--pl)"><b>Commence par ton entreprise</b><div class="mut" style="margin:4px 0 8px">Ton nom, ton téléphone et ton numéro Mobile Money apparaîtront sur tes documents.</div><button class="btn" onclick="bizScreen()">Renseigner mon entreprise</button></div>';
 else h+='<button class="btn g" onclick="bizScreen()">🏢 '+esc(BIZ.name)+' — modifier</button>';
 h+='<div class="chips" style="margin:10px 0">'+[["all","Tous"],["facture","Factures"],["devis","Devis"],["recu","Reçus"]].map(function(f){return '<span class="chip" style="'+(FILTER===f[0]?'background:var(--p);color:#fff':'')+'" onclick="FILTER=\''+f[0]+'\';home()">'+f[1]+'</span>';}).join("")+'</div>';
 var L=SAVE.docs.filter(function(d){return FILTER==="all"||d.type===FILTER;}).sort(function(a,b){return b.upd-a.upd;});
 if(!L.length)h+='<p class="mut" style="text-align:center;margin:30px 0">Aucun document pour le moment.<br>Crée ta première facture en 1 minute.</p>';
 var tot=0;L.forEach(function(d){if(d.type==="facture")tot+=totalOf(d);h+='<div class="card cvrow"><div class="grow" onclick="openDoc(\''+d.id+'\')"><b>'+TYPES[d.type].n+' '+esc(d.num)+' · '+esc(d.cn||"Sans client")+'</b><span class="mut">'+fd(d.date)+' · '+money(totalOf(d))+' '+cur()+(d.type==="facture"&&calc(d).rest<=0&&totalOf(d)>0?' · ✅ payée':'')+'</span></div><button class="btn s g" onclick="dupDoc(\''+d.id+'\')">⧉</button><button class="btn s r" onclick="delDoc(\''+d.id+'\')">🗑</button></div>';});
 if(L.length&&(FILTER==="all"||FILTER==="facture"))h+='<p class="mut" style="text-align:center">Total facturé : <b>'+money(tot)+' '+cur()+'</b></p>';
 h+='</div></main>';shell("Facture Express","",h);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function newDoc(t){if(!BIZ.name){toast("Renseigne d'abord ton entreprise");bizScreen();return;}
 var d={id:uid(),type:t,num:nextNum(t),date:iso(),due:"",cn:"",ca:"",cp:"",items:[{d:"",q:1,p:""}],tax:0,disc:0,paid:0,notes:"",upd:Date.now()};SAVE.docs.push(d);persist();openDoc(d.id);}
function openDoc(id){D=SAVE.docs.filter(function(x){return x.id===id;})[0];if(D)editor();}
function dupDoc(id){var s=SAVE.docs.filter(function(x){return x.id===id;})[0];if(!s)return;var c=JSON.parse(JSON.stringify(s));c.id=uid();c.num=nextNum(c.type);c.date=iso();c.paid=0;c.upd=Date.now();SAVE.docs.push(c);persist();home();}
function delDoc(id){if(!confirm("Supprimer ce document ?"))return;SAVE.docs=SAVE.docs.filter(function(x){return x.id!==id;});persist();home();}
function U1(k,v){D[k]=v;D.upd=Date.now();persist();upTot();}
function UI(i,k,v){D.items[i][k]=v;D.upd=Date.now();if(k==="d"&&!D.items[i].p){var c=catalog()[v.toLowerCase()];if(c){D.items[i].p=c;var el=document.getElementById("ip"+i);if(el)el.value=c;}}persist();upTot();}
function catalog(){var o={};SAVE.docs.forEach(function(d){d.items.forEach(function(i){if(i.d&&i.p)o[i.d.toLowerCase()]=i.p;});});return o;}
function addItem(){D.items.push({d:"",q:1,p:""});persist();editor();setTimeout(function(){var e=document.getElementById("id"+(D.items.length-1));if(e)e.focus();},50);}
function delItem(i){if(D.items.length>1)D.items.splice(i,1);else D.items[0]={d:"",q:1,p:""};persist();editor();}
function upTot(){var c=calc(D),e=document.getElementById("tot");if(e)e.innerHTML='Total : <b>'+money(c.total)+' '+cur()+'</b>'+(D.type!=="recu"&&c.paid>0?'<br>Reste à payer : <b>'+money(Math.max(0,c.rest))+' '+cur()+'</b>':'');D.items.forEach(function(it,i){var m=document.getElementById("im"+i);if(m)m.textContent=money((+it.q||0)*(+it.p||0))+" "+cur();});}
function toFacture(){D.type="facture";D.num=nextNum("facture");persist();editor();toast("Devis converti en facture");}
function setPaid(){D.paid=calc(D).total;persist();editor();}
function editor(){VIEW="edit";var T=TYPES[D.type],h='<main><div class="wrap">';
 h+='<div class="card"><div class="h">'+T.n+'</div><div class="row"><div><label>Numéro</label><input value="'+esc(D.num)+'" oninput="U1(\'num\',this.value)"></div><div><label>Date</label><input type="date" value="'+D.date+'" oninput="U1(\'date\',this.value)"></div></div>'+(D.type==="recu"?'':'<label>'+(D.type==="devis"?"Valable jusqu'au":"Échéance")+' (facultatif)</label><input type="date" value="'+(D.due||"")+'" oninput="U1(\'due\',this.value)">')+'</div>';
 h+='<div class="card"><div class="h">Client</div><label>Nom</label><input value="'+esc(D.cn)+'" placeholder="Nom du client" oninput="U1(\'cn\',this.value)"><label>Adresse (facultatif)</label><input value="'+esc(D.ca)+'" oninput="U1(\'ca\',this.value)"><label>Téléphone (facultatif)</label><input inputmode="tel" value="'+esc(D.cp)+'" oninput="U1(\'cp\',this.value)"></div>';
 h+='<datalist id="dl">'+Object.keys(catalog()).slice(0,60).map(function(k){return '<option value="'+esc(k)+'">';}).join("")+'</datalist>';
 D.items.forEach(function(it,i){h+='<div class="card"><div class="row" style="align-items:center"><b style="flex:none">Ligne '+(i+1)+'</b><span class="mut" style="text-align:right" id="im'+i+'">'+money((+it.q||0)*(+it.p||0))+' '+cur()+'</span></div><label>Désignation</label><input id="id'+i+'" list="dl" value="'+esc(it.d)+'" placeholder="Ex : Sac de riz 50 kg" oninput="UI('+i+',\'d\',this.value)"><div class="row"><div><label>Quantité</label><input inputmode="decimal" value="'+esc(it.q)+'" oninput="UI('+i+',\'q\',this.value)"></div><div><label>Prix unitaire ('+cur()+')</label><input id="ip'+i+'" inputmode="decimal" value="'+esc(it.p)+'" oninput="UI('+i+',\'p\',this.value)"></div></div><button class="btn s r" style="margin-top:8px" onclick="delItem('+i+')">✕ Retirer</button></div>';});
 h+='<button class="btn g" onclick="addItem()">＋ Ajouter une ligne</button>';
 h+='<div class="card"><div class="h">Montants</div>'+(D.type==="recu"?'':'<div class="row"><div><label>Remise (%)</label><input inputmode="decimal" value="'+esc(D.disc||"")+'" placeholder="0" oninput="U1(\'disc\',this.value)"></div><div><label>TVA (%)</label><input inputmode="decimal" value="'+esc(D.tax||"")+'" placeholder="0" oninput="U1(\'tax\',this.value)"></div></div><label>Acompte déjà versé ('+cur()+')</label><input inputmode="decimal" value="'+esc(D.paid||"")+'" placeholder="0" oninput="U1(\'paid\',this.value)">')+'<div id="tot" style="margin-top:12px;font-size:17px"></div>'+(D.type==="facture"?'<button class="btn s g" onclick="setPaid()">✅ Marquer payée</button>':'')+(D.type==="devis"?'<button class="btn s g" onclick="toFacture()">➜ Transformer en facture</button>':'')+'</div>';
 h+='<div class="card"><label>Conditions / notes (facultatif)</label><textarea oninput="U1(\'notes\',this.value)" placeholder="Ex : Paiement à la livraison. Merci de votre confiance.">'+esc(D.notes)+'</textarea></div></div></main><button class="fab" onclick="preview()">👁 Aperçu et PDF</button>';
 shell(T.n+" "+D.num,'<button class="ib" onclick="home()">←</button>',h);upTot();}
function preview(){VIEW="prev";loadPhoto(BIZ.logo).then(function(lg){var pages=renderDoc(D,lg),h='<main style="padding:0 0 90px" class="pv">';pages.forEach(function(p,i){h+='<div id="pp'+i+'"></div>';});
 h+='</main><div style="position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px"><button class="btn" style="margin:0;flex:2" onclick="exportPDF()">📄 PDF</button><button class="btn g" style="margin:0;flex:1" onclick="exportImg()">🖼 JPG</button></div>';
 shell("Aperçu",'<button class="ib" onclick="editor()">←</button>',h);pages.forEach(function(p,i){document.getElementById("pp"+i).appendChild(p.c);});});}
var SW=["#1d4ed8","#0f766e","#b91c1c","#7e22ce","#c2410c","#15803d","#111827"];
function bset(k,v){BIZ[k]=v;persist();}
function bizScreen(){VIEW="biz";var pr=isPremium(),h='<main><div class="wrap"><div class="card"><div class="h">Mon entreprise</div>'+
 '<label>Nom *</label><input value="'+esc(BIZ.name)+'" placeholder="Ex : Boutique Akossiwa" oninput="bset(\'name\',this.value)"><label>Adresse</label><input value="'+esc(BIZ.addr)+'" placeholder="Lomé, Togo" oninput="bset(\'addr\',this.value)"><label>Téléphone</label><input inputmode="tel" value="'+esc(BIZ.phone)+'" oninput="bset(\'phone\',this.value)"><label>E-mail (facultatif)</label><input value="'+esc(BIZ.email)+'" oninput="bset(\'email\',this.value)"><label>NIF / RCCM (facultatif)</label><input value="'+esc(BIZ.nif)+'" oninput="bset(\'nif\',this.value)"><label>Paiement (Mixx / Flooz / banque)</label><textarea oninput="bset(\'pay\',this.value)" placeholder="Ex : Mixx by Yas : 90 00 00 00 (Nom)\nFlooz : 99 00 00 00">'+esc(BIZ.pay)+'</textarea><label>Devise</label><select onchange="bset(\'cur\',this.value)">'+[["FCFA","FCFA (franc CFA)"],["EUR","Euro (€)"],["USD","Dollar ($)"]].map(function(c){return '<option value="'+c[0]+'"'+(BIZ.cur===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join("")+'</select></div>'+
 '<div class="card"><div class="h">⭐ Premium '+(pr?'(débloqué)':'')+'</div>'+(pr?'':'<div class="mut" style="margin-bottom:8px">Logo, couleurs et sans mention « Créé avec Facture Express » : regarde 3 pubs, une seule fois.</div><button class="btn" onclick="unlockBox()">▶ Débloquer ('+adCount()+' / '+ADS.need+')</button>')+
 '<label>Logo</label>'+(BIZ.logo?'<img src="'+BIZ.logo+'" style="max-height:70px;max-width:100%;display:block;margin:4px 0">':'')+'<input type="file" accept="image/*" '+(pr?'onchange="pickLogo(this)"':'disabled')+'>'+(BIZ.logo&&pr?'<button class="btn s r" style="margin-top:6px" onclick="bset(\'logo\',\'\');bizScreen()">Retirer le logo</button>':'')+
 '<label>Couleur des documents</label><div>'+SW.map(function(c){return '<span class="sw'+(BIZ.color===c?' on':'')+'" style="background:'+c+';'+(pr?'':'opacity:.45')+'" onclick="'+(pr?'bset(\'color\',\''+c+'\');bizScreen()':'unlockBox()')+'"></span>';}).join("")+'</div>'+
 '<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" style="width:auto" '+(BIZ.foot?'checked':'')+(pr?'':' disabled')+' onchange="bset(\'foot\',this.checked)"> Afficher « Créé avec Facture Express »</label></div>'+
 '<button class="btn" onclick="home()">✓ Enregistrer</button></div></main>';
 shell("Mon entreprise",'<button class="ib" onclick="home()">←</button>',h);}
function pickLogo(inp){var f=inp.files&&inp.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext("2d").drawImage(im,0,0,c.width,c.height);BIZ.logo=c.toDataURL("image/png");persist();bizScreen();};im.src=fr.result;};fr.readAsDataURL(f);}
home();
window.__fa={SAVE:SAVE,nw:nw,words:words,money:money,calc:calc,renderDoc:renderDoc,newDoc:newDoc,openDoc:openDoc,preview:preview,bizScreen:bizScreen,get D(){return D;},BIZ:BIZ,buildPDF:buildPDF,canvasJpeg:canvasJpeg,pageTexts:function(p){return p.c.__t;},setPrem:function(){adSet(3);}};
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){});}
