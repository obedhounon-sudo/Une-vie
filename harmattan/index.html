<html lang="fr"><head>

<style>
:root{--bg:#1d130d;--card:#2e2018;--card2:#3a281d;--line:#4d3626;--ink:#fbeedd;--mut:#c9ae93;--gold:#f2b23a;--red:#d9503a;--green:#59b36f;--blue:#5fb0e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;overflow-y:auto;display:none;background:linear-gradient(180deg,rgba(20,12,8,.78),rgba(20,12,8,.92));padding:calc(10px + env(safe-area-inset-top)) 12px 24px}
#ui.on{display:block}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:44px;margin:0;text-align:center;font-weight:900;letter-spacing:3px;color:var(--gold);text-shadow:0 3px 0 #6b3a10}
h2{margin:0 0 8px;font-size:20px}
.sub{color:var(--mut);font-size:14px;text-align:center;margin-bottom:12px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill b{color:var(--gold)}
.tabs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
.tab{flex:1;min-width:72px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;font-size:13px;font-weight:700;color:var(--mut)}
.tab.on{background:var(--gold);color:#2a1700;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;font-size:15px;background:var(--gold);color:#2a1700;cursor:pointer}
.btn.g{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.full{display:block;width:100%;margin:8px 0;text-align:center}
.btn:disabled{opacity:.4}
.bar{height:8px;border-radius:5px;background:#120a06;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
small,.mut{color:var(--mut)}
.good{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.good .ic{font-size:26px;width:34px;text-align:center}
.up{color:var(--green)}.dn{color:var(--red)}
.qty{display:flex;gap:4px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:9px 14px;border-radius:12px;z-index:60;font-size:14px;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);z-index:50;padding:14px}
#modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font-size:15px;font-weight:700}
.opt small{display:block;font-weight:500;margin-top:2px}
.opt:disabled{opacity:.4}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#hud>*{pointer-events:auto}
.hudtop{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hudbox{background:#000a;border-radius:12px;padding:6px 9px;font-size:12px;font-weight:700;pointer-events:none}
.gauges{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center;min-width:118px}
.gauges .bar{margin:0;height:7px;width:70px}
.spd{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));text-align:right;font-weight:900;font-size:30px;line-height:1;text-shadow:0 2px 0 #000;pointer-events:none}
.spd small{display:block;font-size:11px;font-weight:700}
.prog{position:absolute;left:10px;right:10px;bottom:calc(150px + env(safe-area-inset-bottom));height:8px;border-radius:5px;background:#0008;pointer-events:none;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.steer{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));width:24%;max-width:200px;height:96px;border-radius:22px;background:#ffffff22;border:2px solid #ffffff44;font-size:40px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center}
.steer:active,.steer.on{background:#ffffff55}
.gears{position:absolute;right:10px;top:calc(72px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;width:104px}
.gear{width:100%;padding:7px 0;border-radius:14px;background:#0009;border:2px solid #fff4;color:#fff;font-weight:800;font-size:13px;text-align:center}
.gear.on{background:var(--gold);color:#2a1700;border-color:var(--gold)}
.msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:24px;font-weight:900;text-shadow:0 2px 0 #000;pointer-events:none}
.warn{color:#ff8a70}

<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ================================================================
   HARMATTAN — jeu de convoi (solo)
   ================================================================ */
var LANG=(navigator.language||"fr").slice(0,2)==="fr"?"fr":"en";
try{var _l=localStorage.getItem("harm_lang");if(_l)LANG=_l;}catch(e){}
function L(a){return Array.isArray(a)?(LANG==="fr"?a[0]:a[1]):a;}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(n){return Math.floor(Math.random()*n);}
function pick(a){return a[ri(a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,u){return a+(b-a)*u;}
function F(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function $(s){return document.querySelector(s);}

/* ================= Données ================= */
var GOODS={
 riz:{ic:"🍚",n:["Riz (sac)","Rice (bag)"],base:18000,w:1},
 mais:{ic:"🌽",n:["Maïs (sac)","Maize (bag)"],base:9000,w:1},
 igname:{ic:"🍠",n:["Igname (lot)","Yam (batch)"],base:12000,w:1},
 huile:{ic:"🛢️",n:["Huile de palme (bidon)","Palm oil (drum)"],base:22000,w:1.5},
 ciment:{ic:"🧱",n:["Ciment (sac)","Cement (bag)"],base:5500,w:2},
 tissu:{ic:"🧵",n:["Pagnes (balle)","Fabric (bale)"],base:40000,w:1.5},
 tel:{ic:"📱",n:["Téléphones (carton)","Phones (box)"],base:150000,w:.4},
 med:{ic:"💊",n:["Médicaments (carton)","Medicine (box)"],base:90000,w:.3},
 karite:{ic:"🧴",n:["Beurre de karité","Shea butter"],base:26000,w:1},
 sel:{ic:"🧂",n:["Sel (sac)","Salt (bag)"],base:6000,w:1}
};
var GIDS=Object.keys(GOODS);
var CITIES={
 lome:{n:"Lomé",lat:0,mx:30,my:92,depth:44,d:["Capitale et grand port. Marchés immenses, produits importés bon marché.","Capital and big port. Huge markets, cheap imports."],m:{riz:.85,mais:1.15,igname:1.25,huile:.85,ciment:.8,tissu:.9,tel:.85,med:.9,karite:1.5,sel:.85}},
 aneho:{n:"Aného",lat:0,mx:50,my:95,depth:20,d:["Ville côtière et lagune. Le sel y est presque gratuit.","Lagoon coast town. Salt is almost free here."],m:{riz:.95,mais:.9,igname:1.0,huile:.9,ciment:1.0,tissu:1.05,tel:1.1,med:1.1,karite:1.45,sel:.6}},
 kpalime:{n:"Kpalimé",lat:.1,mx:10,my:70,depth:22,d:["Ville des collines et des plantations, fraîche et verte.","Hill town of plantations, cool and green."],m:{riz:1.15,mais:.8,igname:.85,huile:.95,ciment:1.1,tissu:1.1,tel:1.15,med:1.15,karite:1.3,sel:1.1}},
 tsevie:{n:"Tsévié",lat:.05,mx:30,my:80,depth:24,d:["Carrefour agricole au nord de Lomé.","Farming crossroads north of Lomé."],m:{riz:1.0,mais:.95,igname:.95,huile:1.0,ciment:.95,tissu:1.0,tel:1.0,med:1.0,karite:1.25,sel:1.0}},
 atakpame:{n:"Atakpamé",lat:.25,mx:28,my:58,depth:26,d:["Grande région d'ignames, au centre du pays.","A big yam region at the heart of the country."],m:{riz:1.1,mais:.75,igname:.7,huile:1.0,ciment:1.1,tissu:1.1,tel:1.15,med:1.15,karite:1.0,sel:1.1}},
 sokode:{n:"Sokodé",lat:.45,mx:38,my:40,depth:28,d:["Deuxième ville du pays, étape des convois du nord.","Second city, a stop for northbound convoys."],m:{riz:1.2,mais:.8,igname:.8,huile:1.1,ciment:1.2,tissu:1.2,tel:1.25,med:1.25,karite:.8,sel:1.25}},
 kara:{n:"Kara",lat:.6,mx:46,my:25,depth:32,d:["Grand marché du nord, le karité y est roi.","Big northern market where shea is king."],m:{riz:1.25,mais:.7,igname:.9,huile:1.15,ciment:1.25,tissu:1.25,tel:1.3,med:1.3,karite:.65,sel:1.3}},
 dapaong:{n:"Dapaong",lat:.85,mx:42,my:10,depth:22,d:["Extrême nord, sec et poussiéreux. On y paie cher les produits du sud.","Far north, dry and dusty. Southern goods sell high."],m:{riz:1.35,mais:.65,igname:1.1,huile:1.25,ciment:1.4,tissu:1.35,tel:1.4,med:1.4,karite:.6,sel:1.4}},
 ouaga:{n:"Ouagadougou",lat:1,mx:80,my:6,depth:50,d:["Grande capitale au-delà de la frontière : la plus grosse demande de la région.","The big capital across the border: the region's strongest demand."],m:{riz:1.5,mais:.9,igname:1.4,huile:1.45,ciment:1.5,tissu:1.5,tel:1.6,med:1.55,karite:.9,sel:1.5}}
};
var CIDS=Object.keys(CITIES);
var EDGES=[
 {a:"lome",b:"aneho",km:45,t:"road"},{a:"lome",b:"tsevie",km:35,t:"road"},{a:"lome",b:"kpalime",km:120,t:"road"},
 {a:"tsevie",b:"atakpame",km:130,t:"road"},{a:"kpalime",b:"atakpame",km:90,t:"piste"},
 {a:"atakpame",b:"sokode",km:150,t:"road"},{a:"sokode",b:"kara",km:75,t:"road"},
 {a:"kara",b:"dapaong",km:290,t:"road"},{a:"sokode",b:"dapaong",km:260,t:"piste"},{a:"dapaong",b:"ouaga",km:450,t:"frontier"}
];
var VEH={
 moto:{n:["Moto-cargo","Cargo bike"],cap:12,spd:1.2,hp:70,tank:25,cons:.05,cost:180000,col:0xd9503a,hw:.55,hl:1.1,i:"🛵"},
 van:{n:["Camionnette","Pickup van"],cap:40,spd:1,hp:110,tank:80,cons:.12,cost:900000,col:0x3a78c9,hw:1.0,hl:2.3,i:"🚐"},
 truck:{n:["Camion","Truck"],cap:110,spd:.86,hp:180,tank:200,cons:.26,cost:3500000,col:0x4f9a5a,hw:1.25,hl:3.5,i:"🚚"}
};
var UPG={
 eng:{n:["Moteur","Engine"],d:["+6 % de vitesse, chauffe moins","+6% speed, runs cooler"],ic:"⚙️"},
 tir:{n:["Pneus renforcés","Heavy tyres"],d:["Moins de crevaisons, meilleure tenue","Fewer punctures"],ic:"🛞"},
 fil:{n:["Filtre à air","Air filter"],d:["Résiste mieux à la poussière","Resists dust better"],ic:"🌫️"},
 cha:{n:["Châssis et suspension","Chassis & suspension"],d:["Moins de dégâts sur les chocs","Less damage from impacts"],ic:"🔩"}
};
var NAMES=["Kodjo","Afi","Komlan","Ayaba","Yawo","Edem","Mawuena","Sena","Kafui","Dzifa","Selom","Kossi","Abla","Essi","Koffi","Ama","Yao","Akouvi","Mawuli","Dela"];
var ROLES={driver:["Chauffeur","Driver","🚦"],nav:["Navigateur","Navigator","🧭"],trader:["Négociant","Trader","🤝"],mech:["Mécanicien","Mechanic","🔧"]};
var TRAITS={prudent:["Prudent","Careful"],econ:["Économe","Thrifty"],chance:["Chanceux","Lucky"],costaud:["Costaud","Tough"]};
var FUEL_PRICE=700;

/* ================= État ================= */
var GS=null,TAB="market",D=null,GAMEOVER=false;
var SAVE_KEY="harm_save_v1";
function saveGame(){try{if(GS&&!GAMEOVER)localStorage.setItem(SAVE_KEY,JSON.stringify(GS));}catch(e){}}
function loadGame(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.veh&&s.crew)return s;}catch(e){}return null;}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function mkCrew(role,skill,trait){
 var tr=trait||pick(Object.keys(TRAITS));
 return {id:Math.random().toString(36).slice(2,8),n:pick(NAMES),role:role,skill:skill,trait:tr,morale:75,fat:0,wage:Math.round((3000+2500*skill)*(tr==="econ"?.8:1))};
}
function newGame(){
 GS={day:1,deadline:60,money:500000,debt:1000000,city:"lome",seed:Math.random()*1000,
  veh:{t:"van",hp:80,fuel:40,tires:70,filter:75,up:{eng:0,tir:0,fil:0,cha:0}},
  cargo:{},crew:[mkCrew("mech",2,"econ")],cand:[],rep:{m:0,t:0,v:0},imp:{},nz:{},ev:[],log:[],stats:{legs:0,km:0,profit:0,sold:0,events:0},tut:0};
 CIDS.forEach(function(c){GS.imp[c]={};GS.nz[c]={};GIDS.forEach(function(g){GS.imp[c][g]=0;GS.nz[c][g]=rnd(-.08,.08);});});
 genCands();
 GAMEOVER=false;
 addLog(["Tu as hérité d'une vieille camionnette et d'une dette de 1 000 000 F. Tu as 60 jours.","You inherited an old van and a 1,000,000 F debt. You have 60 days."]);
}
function addLog(t){GS.log.unshift({d:GS.day,t:t});if(GS.log.length>40)GS.log.pop();}

/* ---- équipage ---- */
function crewBest(role){
 var b=0;GS.crew.forEach(function(c){if(c.role===role){var s=c.skill-(c.fat>75?1:0)-(c.morale<25?1:0);if(s>b)b=s;}});return Math.max(0,b);
}
function luck(){var l=0;GS.crew.forEach(function(c){if(c.trait==="chance")l=.05;});return l;}
function wages(){var s=0;GS.crew.forEach(function(c){s+=c.wage;});return s;}
function genCands(){
 GS.cand=[];var roles=Object.keys(ROLES);
 for(var i=0;i<3;i++){var r=roles[ri(4)],sk=clamp(1+Math.floor(Math.abs(rnd(-1,1))*3.2+Math.random()*(1+GS.rep.t/20)),1,5);GS.cand.push(mkCrew(r,sk));}
}
function maxCrew(){return 3+(GS.rep.t+GS.rep.m+GS.rep.v>=40?1:0);}

/* ---- météo : harmattan ---- */
function noise(i){var s=Math.sin(i*12.9898+GS.seed*78.233)*43758.5453;return s-Math.floor(s);}
function vnoise(t){var i=Math.floor(t),f=t-i;f=f*f*(3-2*f);return noise(i)*(1-f)+noise(i+1)*f;}
function harm(day,lat){return clamp(.14+.42*lat+vnoise(day/3.1)*.55-.16,0,1);}
function forecast(day,lat){return clamp(harm(day,lat)+(noise(day*7.1)-.5)*.55*(1-.19*crewBest("nav")),0,1);}
function wxName(h){return h<.25?["Dégagé","Clear"]:h<.5?["Brume sèche","Dry haze"]:h<.75?["Poussiéreux","Dusty"]:["Tempête de sable","Sandstorm"];}
function wxIcon(h){return h<.25?"☀️":h<.5?"🌤️":h<.75?"🌫️":"🌪️";}

/* ---- marché ---- */
function depthOf(c,g){return CITIES[c].depth*(GOODS[g].base>80000?.5:1);}
function stepOf(c,g){return .9/depthOf(c,g);}
function evMult(c,g){var m=1;GS.ev.forEach(function(e){if(e.c===c&&e.g===g&&e.until>=GS.day)m*=e.k;});return m;}
function baseK(c,g){return CITIES[c].m[g]*GOODS[g].base*(1+GS.nz[c][g])*evMult(c,g);}
function mid(c,g){return baseK(c,g)*(1+GS.imp[c][g]);}
function repBonus(){return Math.min(.04,(GS.rep.m+GS.rep.t+GS.rep.v)/600);}
function quote(c,g,n,side){
 var k=baseK(c,g),im=GS.imp[c][g],st=stepOf(c,g),tot=0,tb=crewBest("trader")*.025;
 for(var i=0;i<n;i++){
  if(side==="buy")tot+=k*(1+im+i*st)*1.04*(1-tb);
  else tot+=k*Math.max(.35,1+im-i*st)*.96*(1+tb+repBonus());
 }
 return tot;
}
function cargoWeight(){var w=0;for(var g in GS.cargo)w+=GS.cargo[g].q*GOODS[g].w;return w;}
function cargoUnits(){var n=0;for(var g in GS.cargo)n+=GS.cargo[g].q;return n;}
function capFree(){return VEH[GS.veh.t].cap-cargoWeight();}
function buyGood(g,n){
 var c=GS.city,maxByCap=Math.floor((capFree()+1e-6)/GOODS[g].w);n=Math.min(n,maxByCap);
 if(n<=0)return 0;
 while(n>0&&quote(c,g,n,"buy")>GS.money)n--;
 if(n<=0)return 0;
 var cost=quote(c,g,n,"buy");GS.money-=cost;
 var h=GS.cargo[g]||(GS.cargo[g]={q:0,avg:0});h.avg=(h.avg*h.q+cost)/(h.q+n);h.q+=n;
 GS.imp[c][g]+=n*stepOf(c,g);
 return n;
}
function sellGood(g,n){
 var c=GS.city,h=GS.cargo[g];if(!h)return 0;n=Math.min(n,h.q);if(n<=0)return 0;
 var rev=quote(c,g,n,"sell");GS.money+=rev;GS.stats.profit+=rev-h.avg*n;GS.stats.sold+=n;
 h.q-=n;GS.imp[c][g]=Math.max(-.65,GS.imp[c][g]-n*stepOf(c,g));
 if(h.q<=0)delete GS.cargo[g];
 return rev;
}

/* ---- passage des jours ---- */
function advanceDay(){
 GS.day++;
 CIDS.forEach(function(c){GIDS.forEach(function(g){
  GS.imp[c][g]*=.86;GS.nz[c][g]=clamp(GS.nz[c][g]*.9+rnd(-.045,.045),-.22,.22);
 });});
 GS.ev=GS.ev.filter(function(e){return e.until>=GS.day;});
 if(Math.random()<.35){var c=pick(CIDS),g=pick(GIDS),sh=Math.random()<.6;GS.ev.push({c:c,g:g,k:sh?1.38:.76,until:GS.day+rnd(4,8)|0});}
 var w=wages(),paid=Math.min(GS.money,w);GS.money-=paid;
 GS.crew.forEach(function(c){
  if(paid<w)c.morale=clamp(c.morale-12,0,100);
  c.fat=clamp(c.fat-(c.trait==="costaud"?12:7),0,100);
  c.morale=clamp(c.morale+(c.morale<60?1.5:0)-(c.morale>80?.5:0),0,100);
 });
 // départs d'équipiers démoralisés
 for(var i=GS.crew.length-1;i>=0;i--){if(GS.crew[i].morale<=8){addLog([GS.crew[i].n+" a quitté ton équipe.",GS.crew[i].n+" left your crew."]);GS.crew.splice(i,1);}}
 if(Math.random()<.4)genCands();
}
function evNews(){
 var out=[];GS.ev.forEach(function(e){if(e.until>=GS.day&&(e.c===GS.city||Math.random()<2)){out.push(e);}});return out;
}

/* ================= Audio ================= */
var AC=null,eng=null,SND=true;
try{SND=localStorage.getItem("harm_snd")!=="0";}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sl){
 if(!SND)return;var A=ac();if(!A)return;
 try{var o=A.createOscillator(),g=A.createGain();o.type=type||"sine";o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),A.currentTime+d);g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d);}catch(e){}
}
function sfx(k){
 if(k==="click")tone(520,.05,"square",.03);
 else if(k==="coin"){tone(900,.07,"triangle",.05);setTimeout(function(){tone(1300,.1,"triangle",.05);},60);}
 else if(k==="hit")tone(110,.3,"sawtooth",.09,.35);
 else if(k==="horn"){tone(330,.28,"square",.05);tone(415,.28,"square",.05);}
 else if(k==="ok"){tone(523,.1,"triangle",.06);setTimeout(function(){tone(784,.15,"triangle",.06);},90);}
 else if(k==="bad")tone(200,.25,"sawtooth",.06,.5);
}
function engineSound(on,spd){
 if(!SND||!ac()){return;}
 try{

function buildVehicle(t,color,fill,oncoming){
 var g=new THREE.Group(),wheels=[];
 function wheel(x,y,z,r){var p=new THREE.Group();p.position.set(x,y,z);var w=mesh(GEO.cyl,0x151515,r*2,.4,r*2,0,0,0);w.rotation.z=Math.PI/2;p.add(w);g.add(p);wheels.push(p);}
 if(t==="moto"){
  g.add(mesh(GEO.box,color,.35,.45,1.7,0,.75,0));
  g.add(mesh(GEO.box,0x222,.12,.12,.9,0,1.15,-.9)).rotation.x=0;
  g.add(mesh(GEO.box,0x222,.8,.08,.08,0,1.2,-.7));
  g.add(mesh(GEO.box,0x333,.5,.55,.9,0,1.05,.5));
  g.add(mesh(GEO.ico,0x6b4a33,.45,.5,.45,0,1.7,0));
  g.add(mesh(GEO.box,0x2d6bb0,.5,.7,.35,0,1.35,.05));
  wheel(0,.38,-.75,.38);wheel(0,.38,.75,.38);
  g.add(mesh(GEO.box,0xc9a46a,.9,.6,.8,0,1.0,1.0));
 }else{
  var big=t==="truck",L=big?7:4.6,W=big?2.5:2.0,hh=big?1.7:1.3;
  g.add(mesh(GEO.box,0x252525,W*.95,.4,L,0,.6,0));
  g.add(mesh(GEO.box,color,W,hh,L*.3,0,.9+hh/2,-L*.33));
  g.add(mesh(GEO.box,0xa6d6ff,W*.88,hh*.42,.06,0,.9+hh*.62,-L*.33-L*.151));
  g.add(mesh(GEO.box,0x1a1a1a,W*1.0,.3,.2,0,.5,-L*.5-.05));
  g.add(mesh(GEO.box,bmat(oncoming?0xfff2a0:0xffe9a0),.35,.22,.08,-W*.32,.85,-L*.5-.05));
  g.add(mesh(GEO.box,bmat(oncoming?0xfff2a0:0xffe9a0),.35,.22,.08,W*.32,.85,-L*.5-.05));
  g.add(mesh(GEO.box,bmat(0xff2a2a),.3,.2,.08,-W*.35,.85,L*.5+.04));
  g.add(mesh(GEO.box,bmat(0xff2a2a),.3,.2,.08,W*.35,.85,L*.5+.04));
  g.add(mesh(GEO.box,0x6b4a2a,W*.96,.55,L*.56,0,1.15,L*.17));
  var cg=new THREE.Group();cg.position.set(0,1.45,L*.17);g.add(cg);
  var n=Math.round(clamp(fill||0,0,1)*(big?14:8));
  for(var i=0;i<n;i++){var cx_=(i%2?-1:1)*W*.22,row=Math.floor(i/2),cz=-L*.22+row*(L*.5/Math.max(1,Math.ceil(n/2)));cg.add(mesh(GEO.box,i%3?0xc9a46a:0xb08850,W*.42,.7+(i%3)*.12,.9,cx_,0,cz));}
  if(n>0)cg.add(mesh(GEO.box,0x7a6a58,W*.93,.14,L*.5,0,.55+.2,0));
  var wx=W*.5;
  wheel(-wx,.5,-L*.33,.5);wheel(wx,.5,-L*.33,.5);wheel(-wx,.5,L*.3,.5);wheel(wx,.5,L*.3,.5);
  if(big){wheel(-wx,.5,L*.1,.5);wheel(wx,.5,L*.1,.5);}
 }
 g.userData.wheels=wheels;return g;
}

 if(k==="pothole"){m=new THREE.Group();m.add(mesh(GEO.cyl,0x7a6a5a,2.3,.02,2.1,0,.03,0));m.add(mesh(GEO.cyl,0x15110d,1.8,.04,1.6,0,.05,0));o.hw=.95;o.hl=.9;}
 else if(k==="rock"){m=mesh(GEO.ico,0x6b6258,1.6,1.2,1.5,0,.5,0);o.hw=.75;o.hl=.7;}
 else if(k==="goat"){m=new THREE.Group();for(var i=0;i<3;i++){var gg=new THREE.Group();gg.add(mesh(GEO.box,i%2?0xeadfcf:0x6b4a33,.5,.5,.95,0,.6,0));gg.add(mesh(GEO.box,i%2?0xeadfcf:0x6b4a33,.3,.35,.4,0,.95,.55));[[-.18,-.35],[.18,-.35],[-.18,.35],[.18,.35]].forEach(function(l){gg.add(mesh(GEO.box,0x3a2a1a,.1,.5,.1,l[0],.25,l[1]));});gg.position.set(0,0,i*1.3-1.3);m.add(gg);}o.hw=.75;o.hl=1.9;o.moving=false;o.dir=x>0?-1:1;}
 else if(k==="slow"){var t=Math.random()<.5?"moto":"van";m=buildVehicle(t,pick([0xe0b020,0xd9503a,0x4a8fd9,0xffffff]),Math.random(),false);o.hw=t==="moto"?.6:1.0;o.hl=t==="moto"?1.1:2.3;o.vs=rnd(9,13);}
 else if(k==="oncoming"){var t2=pick(["van","truck","moto"]);m=buildVehicle(t2,pick([0xb8302a,0x2a8a5a,0x2a5fb8,0xcfcfcf]),Math.random(),true);m.rotation.y=Math.PI;o.hw=t2==="moto"?.6:(t2==="truck"?1.3:1.0);o.hl=t2==="moto"?1.1:(t2==="truck"?3.5:2.3);o.vs=-17;}

function setScene(h,type,travel,spd){
 // brouillard / lumière selon l'harmattan

function updateDecor(travel){
 var cz=-travel;
 R.dec.forEach(function(d){
  var lim=d.k==="hill"?200:30;
  if(d.m.position.z>cz+lim){
   var far=d.k==="hill"?900:d.k==="pole"?660:620;
   d.m.position.z-=far+rnd(0,d.k==="pole"?0:80);
   if(d.k==="tree"||d.k==="hut")d.m.position.x=(d.m.position.x>0?1:-1)*rnd(d.k==="hut"?10:9,d.k==="hut"?22:40);
  }
 });
 // poussière
 var a=R.dust.geometry.attributes.position.array,N=R.dustN;
 for(var i=0;i<N;i++){var zi=i*3+2;if(a[zi]+(-travel)>cz+8||a[zi]>cz+8){a[zi]=cz-rnd(60,130);a[i*3]=rnd(-40,40);a[i*3+1]=rnd(.3,14);}}
 R.dust.geometry.attributes.position.needsUpdate=true;
}
function updateDustFlow(dt,spd){
 var a=R.dust.geometry.attributes.position.array,N=R.dustN,cz=R.cam.position.z;
 for(var i=0;i<N;i++){var zi=i*3+2;a[zi]+=(spd*.0+9+Math.sin(i)*3)*dt;a[i*3]+=Math.sin(R.t*.6+i)*.02;if(a[zi]>cz+6){a[zi]=cz-rnd(70,130);a[i*3]=cam_x()+rnd(-40,40);a[i*3+1]=rnd(.3,14);}}

}

function pickEvent(D){
 var pool=[],V=GS.veh,h=D.h,ratio=cargoWeight()/VEH[V.t].cap;
 pool.push(["breakdown",.5+(100-hpPct())/40]);pool.push(["flat",.6+(100-V.tires)/50]);
 if(ratio>.8)pool.push(["weigh",1.1]);
 pool.push(["stranded",.8]);pool.push(["village",.6,"b"]);pool.push(["merchant",1,"b"]);
 if(h>.5)pool.push(["storm",2.2]);
 pool.push(["river",D.e.t==="piste"?1.6:.25]);
 if(D.e.t==="piste")pool.push(["toll",.9]);
 if(V.fuel<VEH[V.t].tank*.4)pool.push(["pump",1,"b"]);
 var low=false;GS.crew.forEach(function(c){if(c.morale<45)low=true;});if(low)pool.push(["crew",1.6,"b"]);
 pool=pool.filter(function(p){return D.used.indexOf(p[0])<0;});
 var tot=0;pool.forEach(function(p){tot+=p[1];});var r=Math.random()*tot,ch=pool[0];
 for(var i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0){ch=pool[i];break;}}
 D.used.push(ch[0]);
 return ch[2]==="b"?EVBUILD[ch[0]]():EVS[ch[0]];
}

 if(fx.money){GS.money=Math.max(0,GS.money+fx.money);}
 if(fx.hp)V.hp=clamp(V.hp+fx.hp,1,mx.hp);
 if(fx.tires)V.tires=clamp(V.tires+fx.tires,0,100);
 if(fx.filter)V.filter=clamp(V.filter+fx.filter,0,100);
 if(fx.fuel)V.fuel=clamp(V.fuel+fx.fuel,0,mx.tank);
 if(fx.days&&D)D.delay+=fx.days;
 if(fx.temp&&D)D.temp=clamp(D.temp+fx.temp,60,125);
 if(fx.morale)GS.crew.forEach(function(c){c.morale=clamp(c.morale+fx.morale,0,100);});
 if(fx.rep){for(var k in fx.rep)GS.rep[k]=clamp(GS.rep[k]+fx.rep[k],0,100);}
 if(fx.cargo){for(var g in GS.cargo){var l=Math.floor(GS.cargo[g].q*fx.cargo);GS.cargo[g].q-=l;if(GS.cargo[g].q<=0)delete GS.cargo[g];}}
 if(fx.units&&fx.units.q>0){var u=fx.units,h=GS.cargo[u.g]||(GS.cargo[u.g]={q:0,avg:0});h.avg=(h.avg*h.q+u.c)/(h.q+u.q);h.q+=u.q;}
 if(fx.donate){var h2=GS.cargo[fx.donate];if(h2){h2.q-=4;if(h2.q<=0)delete GS.cargo[fx.donate];}}
}

 function hold(id,k){var b=$(id);b.addEventListener("pointerdown",function(e){KEYS[k]=true;b.classList.add("on");e.preventDefault();});["pointerup","pointerleave","pointercancel"].forEach(function(ev_){b.addEventListener(ev_,function(){KEYS[k]=false;b.classList.remove("on");});});}

function dmg(n,msg,sound){
 var V=GS.veh;var red=1-.07*crewBest("driver")-.06*V.up.cha;GS.crew.forEach(function(c){if(c.trait==="prudent")red-=.05;});
 n=Math.max(1,Math.round(n*clamp(red,.4,1)));
 V.hp=Math.max(0,V.hp-n);D.dmg+=n;D.shake=.35;R.shake=.5;
 D.msg=msg+" -"+n;D.msgT=1.6;sfx("hit");try{if(SND&&navigator.vibrate)navigator.vibrate(60);}catch(e){}
 GS.crew.forEach(function(c){c.morale=clamp(c.morale-1.5,0,100);});

function stepDrive(dt){
 if(!D||D.paused)return;
 var V=GS.veh,Vd=VEH[V.t];D.t+=dt;R.t+=dt;
 // météo variable
 D.h=clamp(lerp(D.h0,D.h1,D.z/D.len)+.18*Math.sin(D.z/260+D.e.km),0,1);
 // vitesse cible
 var base=22*Vd.spd*(1+.06*V.up.eng),gm=D.gear===1?.62:D.gear===3?1.32:1;
 var tgt=D.stopped?0:base*gm;
 var onSh=Math.abs(D.x)>5.1,rough=D.e.t==="piste"?.88:1;
 tgt*=rough*(onSh?.6:1)*(V.filter<35?.75:1)*(D.temp>105?.7:1)*(V.tires<20?.8:1);
 if(V.fuel<=0)tgt=0;
 var acc=D.spd<tgt?7:(D.stopped?30:20);
 D.spd+=clamp(tgt-D.spd,-acc*dt,acc*dt);
 // direction
 var st=(KEYS.left?-1:0)+(KEYS.right?1:0);
 var lat=(5.5+.5*crewBest("driver"))*(.7+.3*clamp(D.spd/20,0,1))*(V.tires<30?.8:1)*(.9+.06*V.up.tir);
 var wind=Math.sin(D.t*.9+D.z*.03)*D.h*1.4*(D.spd/22);
 D.x=clamp(D.x+(st*lat+wind)*dt,-6.3,6.3);
 // progression
 var dz=D.spd*dt;D.z+=dz;
 // carburant
 V.fuel=Math.max(0,V.fuel-Vd.cons*(D.e.km/D.len)*dz*(1+.22*(D.gear-2))-(D.stopped?.0006*dt*Vd.tank:0));
 // chaleur
 var heatIn=(D.stopped?.15:.55+.55*(D.gear-1))*(1+1.3*D.h)*(1+(100-V.filter)/160)*(1-.07*V.up.eng)*1.8;
 D.temp=clamp(D.temp+(heatIn-(D.temp-60)*(.05+D.spd*.002+(D.stopped?.15:0)))*dt,60,125);
 if(D.temp>106){V.hp=Math.max(0,V.hp-.35*dt);D.msg=L(["Moteur en surchauffe !","Engine overheating!"]);D.msgT=.5;}
 // filtre / pneus
 V.filter=Math.max(0,V.filter-(.14+D.h*.55)*(1-.2*V.up.fil)*dt*(D.spd/22));
 if(D.stopped&&D.spd<1){
  D.stopT+=dt;
  if(crewBest("mech")>0){V.filter=Math.min(100,V.filter+1.6*crewBest("mech")*dt);if(hpPct()<85)V.hp=Math.min(Vd.hp*.85,V.hp+.12*crewBest("mech")*dt);}
  GS.crew.forEach(function(c){c.fat=Math.max(0,c.fat-.8*dt);});
  if(D.stopT>=40){D.stopT-=40;D.delay+=.25;}
 }
 // apparition d'obstacles
 while(D.nextObs<D.z+230&&D.nextObs<D.len-40){spawnObs();}
 // obstacles
 updateObs(dt);
 // rencontres
 if(D.evIdx===undefined)D.evIdx=0;
 if(D.fr&&D.z>=D.fr&&!D.forced.fr){D.forced.fr=true;openEvent(EVS.frontier);return;}
 if(D.evIdx<D.evs.length&&D.z>=D.evs[D.evIdx]){D.evIdx++;openEvent(pickEvent(D));return;}
 if(D.temp>=118&&!D.forced.heat){D.forced.heat=true;openEvent(EVS.overheat);return;}
 if(V.fuel<=0&&!D.forced.fuel){D.forced.fuel=true;openEvent(EVS.fuelout);return;}
 if(V.hp<=0){wreck();return;}
 if(D.z>=D.len){arrive();return;}
 // caméra et véhicule
 updateRender(dt);
 D.hud-=dt;if(D.hud<=0){D.hud=.1;hudUpdate();}
 if(D.msgT>0)D.msgT-=dt;
 engineSound(true,D.spd);
}
function spawnObs(){
 var e=D.e,road=e.t!=="piste",tab=road?[["pothole",3],["goat",1.2],["slow",2.4],["oncoming",3]]:[["pothole",4],["rock",3],["goat",2],["slow",1.2],["oncoming",1]];
 var tot=0;tab.forEach(function(t){tot+=t[1];});var r=Math.random()*tot,k="pothole";
 for(var i=0;i<tab.length;i++){r-=tab[i][1];if(r<=0){k=tab[i][0];break;}}
 var z=D.nextObs;
 var near=R.obs;
 if(k==="oncoming"){for(var a=0;a<near.length;a++)if(near[a].k==="slow"&&Math.abs(near[a].z-z)<170)k="pothole";}
 if(k==="slow"){for(var b=0;b<near.length;b++)if(near[b].k==="oncoming"&&Math.abs(near[b].z-z)<210)k="pothole";}
 var x=k==="oncoming"?-2.5:k==="slow"?2.5:k==="goat"?(Math.random()<.5?-6.2:6.2):rnd(-4.1,4.1);
 if(k==="pothole")x=pick([-2.6,2.6,rnd(-4,4)]);
 var o=makeObstacle(k,x,z);R.obs.push(o);
 D.nextObs+=(road?rnd(60,110):rnd(42,75))*(1+Math.random()*.2);
}
function updateObs(dt){
 var V=GS.veh,Vd=VEH[V.t],hwP=Vd.hw,hlP=Vd.hl;
 for(var i=R.obs.length-1;i>=0;i--){
  var o=R.obs[i];
  if(o.k==="slow")o.z+=o.vs*dt;
  else if(o.k==="oncoming")o.z+=o.vs*dt;
  else if(o.k==="goat"){
   if(!o.moving&&o.z-D.z<75)o.moving=true;
   if(o.moving){o.x+=o.dir*1.9*dt;if(Math.abs(o.x)>7)o.moving=false;}
  }
  o.m.position.set(o.x,0,-o.z);
  if(o.m.userData.wheels)o.m.userData.wheels.forEach(function(w){w.rotation.x-=(o.vs||0)*dt*2;});
  var dzz=o.z-D.z,dxx=o.x-D.x;
  if(dzz<-30||dzz>260){R.sc.remove(o.m);R.obs.splice(i,1);continue;}
  // klaxon automatique pour la voiture lente
  if(!o.hit&&Math.abs(dxx)<hwP+o.hw&&Math.abs(dzz)<hlP+o.hl){
   if(o.k==="slow"){
    if(dzz>0){D.spd=Math.min(D.spd,o.vs);if(dzz<hlP+o.hl-.3){o.hit=true;dmg(10,L(["Collision !","Crash!"]));D.spd=Math.min(D.spd,o.vs*.6);}}
   }else{
    o.hit=true;
    if(o.k==="pothole"){dmg(2+D.spd*.16,L(["Nid-de-poule !","Pothole!"]));V.tires=Math.max(0,V.tires-(5+D.spd*.3)*(1-.12*V.up.tir));D.spd*=.7;}
    else if(o.k==="rock"){dmg(9,L(["Rocher !","Rock!"]));V.tires=Math.max(0,V.tires-12*(1-.12*V.up.tir));D.spd*=.5;}
    else if(o.k==="goat"){dmg(3,L(["Une chèvre !","A goat!"]));GS.rep.v=Math.max(0,GS.rep.v-1);D.spd*=.5;}
    else if(o.k==="oncoming"){dmg(38,L(["Choc frontal !","Head-on crash!"]));D.spd*=.2;R.sc.remove(o.m);R.obs.splice(i,1);}
   }
  }
  // klaxon : voiture lente devant
  if(o.k==="slow"&&!o.honk&&dzz>0&&dzz<24&&Math.abs(dxx)<2){o.honk=true;sfx("horn");}
 }
}

function garage(a){
 var V=GS.veh,Vd=VEH[V.t],mdisc=mechDisc(),fp=Math.round(FUEL_PRICE*(1.02-.06*CITIES[GS.city].lat));
 function pay(c){if(GS.money<c){toast(L(["Pas assez d'argent.","Not enough money."]));return false;}GS.money-=c;sfx("coin");return true;}
 if(a==="rep"){var m=Math.ceil(Vd.hp-V.hp),c=m*Math.round(550*mdisc);if(pay(c))V.hp=Vd.hp;}
 else if(a==="fuel"){var f=Math.ceil(Vd.tank-V.fuel);var c2=f*fp;if(GS.money<c2){f=Math.floor(GS.money/fp);c2=f*fp;}if(f>0&&pay(c2))V.fuel=Math.min(Vd.tank,V.fuel+f);}
 else if(a==="tir"){if(pay(Math.round(18000*mdisc)))V.tires=100;}
 else if(a==="fil"){if(pay(Math.round(6000*mdisc)))V.filter=100;}
 else if(a.indexOf("up_")===0){var k=a.slice(3),lv=V.up[k],cost=Math.round(60000*Math.pow(lv+1,1.7));if(lv<3&&pay(cost))V.up[k]++;}
 else if(a.indexOf("buy_")===0){var t=a.slice(4),v=VEH[t],trade=Math.round(VEH[V.t].cost*.55*(.4+.6*hpPct()/100)),price=v.cost-trade;
  if(cargoWeight()>v.cap){toast(L(["Trop de marchandises pour ce véhicule.","Too much cargo for that vehicle."]));}
  else if(pay(Math.max(0,price))){if(price<0)GS.money-=price;GS.veh={t:t,hp:v.hp,fuel:v.tank*.4,tires:100,filter:100,up:{eng:0,tir:0,fil:0,cha:0}};refreshVehicle();addLog(["Nouveau véhicule : "+v.n[0]+".","New vehicle: "+v.n[1]+"."]);}}
 cityScreen();
}

  h+='<div class="card row"><div style="font-size:26px">'+ROLES[c.role][2]+'</div><div class="grow"><b>'+c.n+'</b> · '+L(ROLES[c.role])+' '+"★".repeat(c.skill)+'<br><small>'+L(TRAITS[c.trait])+' · '+F(c.wage)+' F/'+L(["j","d"])+'</small></div><button class="btn s" '+(GS.crew.length>=maxCrew()?'disabled':'')+' onclick="hire(\''+c.id+'\')">'+L(["Embaucher","Hire"])+'</button></div>';
 });
 h+='<div class="card" style="font-size:13px">🚦 '+L(["Chauffeur : moins de dégâts, meilleure direction.","Driver: less damage, better steering."])+'<br>🧭 '+L(["Navigateur : prévisions fiables, papiers, tempêtes.","Navigator: reliable forecasts, paperwork, storms."])+'<br>🤝 '+L(["Négociant : meilleurs prix d'achat et de vente.","Trader: better buy and sell prices."])+'<br>🔧 '+L(["Mécanicien : pannes, réparations moins chères, entretien en route.","Mechanic: breakdowns, cheaper repairs, roadside upkeep."])+'</div>';
 h+='<button class="btn g full" onclick="restDay()">🛏️ '+L(["Se reposer un jour (équipage reposé, prix qui bougent)","Rest a day (crew recovers, prices move)"])+'</button>';
 return h;
}
function hire(id){var c=null,i;for(i=0;i<GS.cand.length;i++)if(GS.cand[i].id===id)c=GS.cand[i];if(!c||GS.crew.length>=maxCrew())return;GS.crew.push(c);GS.cand.splice(GS.cand.indexOf(c),1);sfx("ok");cityScreen();}
function fire(id){GS.crew=GS.crew.filter(function(c){return c.id!==id;});cityScreen();}
function restDay(){advanceDay();GS.crew.forEach(function(c){c.fat=Math.max(0,c.fat-20);c.morale=clamp(c.morale+6,0,100);});addLog(["Une journée de repos à "+CITIES[GS.city].n+".","A day of rest in "+CITIES[GS.city].n+"."]);cityScreen();checkEnd();}
function tabTravel(){
 var h='',V=GS.veh,Vd=VEH[V.t];
 h+='<div class="card" style="padding:6px"><svg viewBox="0 0 100 100" style="width:100%;height:auto;display:block;background:#2a1c12;border-radius:10px">';
 EDGES.forEach(function(e){var a=CITIES[e.a],b=CITIES[e.b];h+='<line x1="'+a.mx+'" y1="'+a.my+'" x2="'+b.mx+'" y2="'+b.my+'" stroke="'+(e.t==="piste"?"#c9a46a":e.t==="frontier"?"#d9503a":"#e6d2b0")+'" stroke-width="'+(e.t==="road"?1.6:1.2)+'" '+(e.t==="piste"?'stroke-dasharray="2 1.6"':'')+'/>';});
 CIDS.forEach(function(c){var C=CITIES[c],here=c===GS.city,reach=!!legInfo(GS.city,c);h+='<circle cx="'+C.mx+'" cy="'+C.my+'" r="'+(here?3.2:2.4)+'" fill="'+(here?"#f2b23a":reach?"#59b36f":"#7a6652")+'" stroke="#1d130d" stroke-width=".7"/><text x="'+C.mx+'" y="'+(C.my-4)+'" font-size="3.6" fill="#fbeedd" text-anchor="middle" font-weight="700">'+C.n+'</text>';});
 h+='</svg></div>';
 h+='<div class="mut" style="font-size:12px;margin:4px 0">'+L(["Trait plein : route · pointillé : piste · rouge : frontière","Solid: road · dashed: track · red: border"])+'</div>';
 neighbors(GS.city).forEach(function(n){
  var e=n.e,C=CITIES[n.to],need=fuelNeed(e),ok=V.fuel>=need*.9,fh=forecast(GS.day+Math.round(legDays(e)/2),C.lat);
  var ttype=e.t==="road"?L(["Route goudronnée","Paved road"]):e.t==="piste"?L(["Piste difficile","Rough track"]):L(["Route + frontière","Road + border"]);
  h+='<div class="card"><div class="row"><div class="grow"><b>→ '+C.n+'</b> <span class="mut">'+e.km+' km</span><br><small>'+ttype+' · ~'+legDays(e)+' '+L(["j","d"])+' · '+L(["carburant","fuel"])+' ~'+Math.round(need)+' L</small><br><small>'+L(["Prévision","Forecast"])+' : '+wxIcon(fh)+' '+L(wxName(fh))+'</small></div><button class="btn" onclick="depart(\''+n.to+'\')">'+L(["Partir","Go"])+'</button></div>'+(!ok?'<small class="dn">⚠ '+L(["Carburant probablement insuffisant","Fuel probably not enough"])+'</small>':'')+'</div>';
 });
 return h;
}
function depart(to){
 var e=legInfo(GS.city,to),V=GS.veh;
 if(hpPct()<25||V.fuel<fuelNeed(e)*.5){
  openModal('<h2>⚠️ '+L(["Départ risqué","Risky departure"])+'</h2><p>'+L(["Ton véhicule est abîmé ou ton réservoir est bas. Partir quand même ?","Your vehicle is damaged or the tank is low. Leave anyway?"])+'</p><button class="btn full" onclick="closeModal();go(\''+to+'\')">'+L(["Partir quand même","Leave anyway"])+'</button><button class="btn g full" onclick="closeModal()">'+L(["Annuler","Cancel"])+'</button>');
 }else go(to);
}
function go(to){saveGame();startLeg(to);}
function payDebt(a){var p=Math.min(GS.money,a>0?a:GS.debt,GS.debt);if(p<=0)return;GS.money-=p;GS.debt-=p;sfx("coin");addLog(["Tu rembourses "+F(p)+" F de ta dette.","You repay "+F(p)+" F of your debt."]);cityScreen();checkEnd();}
function tabLog(){
 var h='<div class="card"><b>'+L(["Dette","Debt"])+' : '+F(GS.debt)+' F</b> · '+L(["Il reste","Left"])+' '+Math.max(0,GS.deadline-GS.day)+' '+L(["jours","days"])+'<div class="row" style="margin-top:8px"><button class="btn s grow" '+(GS.money<100000?'disabled':'')+' onclick="payDebt(100000)">'+L(["Payer 100 000","Pay 100,000"])+'</button><button class="btn s grow" '+(GS.money<=0?'disabled':'')+' onclick="payDebt(0)">'+L(["Tout ce que je peux","All I can"])+'</button></div></div>';
 h+='<div class="card"><b>'+L(["Réputation","Reputation"])+'</b><br><small>'+L(["Marchés","Markets"])+' '+GS.rep.m+' · '+L(["Transporteurs","Hauliers"])+' '+GS.rep.t+' · '+L(["Villages","Villages"])+' '+GS.rep.v+'</small><br><small class="mut">'+L(["Une bonne réputation augmente un peu tes prix de vente et débloque un 4e équipier.","A good reputation slightly raises sale prices and unlocks a 4th crew member."])+'</small></div>';
 h+='<div class="card"><small>'+L(["Trajets","Trips"])+' '+GS.stats.legs+' · km '+GS.stats.km+' · '+L(["Profit commerce","Trading profit"])+' '+F(GS.stats.profit)+' F</small></div>';
 h+='<h2>'+L(["Journal","Log"])+'</h2>'+GS.log.map(function(l){return '<div class="card" style="padding:8px;font-size:13px"><span class="mut">J'+l.d+'</span> '+L(l.t)+'</div>';}).join("");
 return h;
}

/* ================= Boucle ================= */
var last=0,acc=0,idleT=0;
function frame(ts){
 var dt=Math.min(.1,(ts-last)/1000||0);last=ts;
 if(R){
  if(D&&!D.paused){acc+=dt;var n=0;while(acc>=1/60&&n<5){stepDrive(1/60);acc-=1/60;n++;if(!D)break;}if(n===5)acc=0;}
  else if(D&&D.paused){/* gelé */}
  else idleRender(dt);
  R.r.render(R.sc,R.cam);
 }
 requestAnimationFrame(frame);
}
function idleRender(dt){
 idleT+=dt;R.t+=dt;
 var h=GS?harm(GS.day,CITIES[GS.city].lat):.3,travel=0;
 setScene(h,"road",0,0);updateDecor(0);updateDustFlow(dt,0);
 R.veh.position.set(2.5,0,0);
 var a=idleT*.12;R.cam.position.set(2.5+Math.sin(a)*10,3.2+Math.sin(a*.7)*.6,Math.cos(a)*10);R.cam.lookAt(2.5,1.2,0);
 R.cam.fov=55;R.cam.updateProjectionMatrix();
}
window.addEventListener("keydown",function(e){if(e.key==="ArrowLeft"||e.key==="a"||e.key==="q")KEYS.left=true;if(e.key==="ArrowRight"||e.key==="d")KEYS.right=true;
 if(D&&!D.paused){if(e.key==="ArrowUp"||e.key==="w"){D.stopped=false;D.gear=Math.min(3,D.gear+1);}if(e.key==="ArrowDown"||e.key==="s"){D.gear=Math.max(1,D.gear-1);}if(e.key===" "){D.stopped=!D.stopped;}}});
window.addEventListener("keyup",function(e){if(e.key==="ArrowLeft"||e.key==="a"||e.key==="q")KEYS.left=false;if(e.key==="ArrowRight"||e.key==="d")KEYS.right=false;});
document.addEventListener("visibilitychange",function(){if(document.hidden)engineSound(false);});
D=null;
window.__GS=function(){return GS;};window.__D=function(){return D;};
window.__newGame=startNew;window.__step=stepDrive;window.__go=startLeg;
try{
 init3D();menuScreen();
}catch(err){
 document.body.innerHTML='<div style="padding:30px;color:#fff;font-family:sans-serif"><h2>Harmattan</h2><p>3D (WebGL) indisponible sur cet appareil / WebGL not available.</p><pre>'+String(err)+'</pre></div>';
}
requestAnimationFrame(frame);
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script></body></html>
