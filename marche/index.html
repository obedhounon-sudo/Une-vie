var cv=document.getElementById("c"),cx=cv.getContext("2d"),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);}

function rnd(a,b){return a+Math.random()*(b-a);}
function ri(n){return Math.floor(Math.random()*n);}
function pick(a){return a[ri(a.length)];}
function fmtT(s){s=Math.floor(s);var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
var SPR={};
function spr(ch,sz){
 var key=ch+sz,c=SPR[key];if(c)return c;
 var s=Math.ceil(sz*1.5*DPR);c=document.createElement("canvas");c.width=c.height=s;var g=c.getContext("2d");
 g.font=Math.round(sz*DPR)+"px sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(ch,s/2,s/2+sz*DPR*.04);
 SPR[key]=c;return c;
}
function drawSpr(ch,sz,x,y,a,rot,flip){
 var c=spr(ch,sz),d=sz*1.5;
 if(a!==undefined&&a!==1)cx.globalAlpha=a;
 if(rot||flip){cx.save();cx.translate(x,y);if(rot)cx.rotate(rot);if(flip)cx.scale(-1,1);cx.drawImage(c,-d/2,-d/2,d,d);cx.restore();}
 else cx.drawImage(c,x-d/2,y-d/2,d,d);
 if(a!==undefined&&a!==1)cx.globalAlpha=1;
}

/* =================== Sons =================== */
var AC=null,lastSnd={};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,vol,slide){
 if(!SAVE.snd)return;var A=ac();if(!A)return;
 try{var o=A.createOscillator(),g=A.createGain();o.type=type||"sine";o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),A.currentTime+d);
 g.gain.value=vol||.05;g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d);}catch(e){}
}
function sfx(k){
 var n=performance.now();if(lastSnd[k]&&n-lastSnd[k]<(k==="hit"?55:k==="gem"?40:90))return;lastSnd[k]=n;
 if(k==="hit")tone(180+Math.random()*60,.06,"square",.025,.5);
 else if(k==="gem")tone(700+Math.random()*300,.08,"sine",.04);
 else if(k==="hurt")tone(150,.25,"sawtooth",.07,.4);
 else if(k==="boom")tone(110,.3,"sawtooth",.06,.3);
 else if(k==="lvl"){tone(523,.12,"triangle",.07);setTimeout(function(){tone(659,.12,"triangle",.07);},90);setTimeout(function(){tone(784,.2,"triangle",.07);},180);}
 else if(k==="zap")tone(900,.12,"square",.03,.3);
 else if(k==="boss"){tone(80,.7,"sawtooth",.09,1.6);}
 else if(k==="coin")tone(1200,.07,"triangle",.04);
}
var musicOn=false,mi=0;
var SCALE=[0,3,5,7,10,12,15];
function musicTick(){
 if(!musicOn)return;
 if(SAVE.mus&&SAVE.snd&&G&&G.state==="play"){var b=110*Math.pow(2,SCALE[(mi*3)%7]/12);tone(b,.35,"triangle",.035);if(mi%2===0)tone(b*2,.12,"sine",.02);}
 mi++;setTimeout(musicTick,G&&G.t>300?260:340);
}

var G=null,S={},KEY={},JOY={on:false,id:-1,ox:0,oy:0,dx:0,dy:0};
var GCELL=48,GN=48,GHEAD=new Int32Array(GN*GN),GNEXT=new Int32Array(2048),QB=[];

function need(l){return Math.round(3+l*2.2+l*l*0.3);}
function recalc(){
 var c=CH[SAVE.ch],ps=G.ps;
 var oldMax=S.maxhp||0;
 S.maxhp=Math.round(100*(1+.1*ul("hp"))*c.hp+20*(ps.col||0));
 S.speed=118*(1+.05*ul("spd"))*c.sp*(1+.08*(ps.bot||0));
 S.magnet=62*(1+.15*ul("mag"))*(1+.25*(ps.mag||0));
 S.dmg=(1+.08*ul("dmg"))*(1+.1*(ps.epi||0));
 S.cd=Math.max(.4,1-.07*(ps.sab||0))*c.cd;
 S.xp=(1+.08*ul("xp"))*(1+.1*(ps.tre||0));
 S.luck=.06+.02*(ps.tre||0);
 S.armor=ul("arm")+(ps.cou||0);
 S.regen=.5+.3*(ps.col||0);
 S.coin=1+.1*ul("greed");
 if(G.p.hp>0&&S.maxhp>oldMax&&oldMax>0)G.p.hp+=S.maxhp-oldMax;
 if(G.p.hp>S.maxhp)G.p.hp=S.maxhp;
}
function newRun(){

 JOY.on=false;JOY.dx=JOY.dy=0;
}
function flash(m){G.msg=m;G.msgT=2.4;}

/* ---- grille spatiale ---- */
function gridBuild(){
 GHEAD.fill(-1);
 var ox=G.p.x-GN*GCELL/2,oy=G.p.y-GN*GCELL/2,E=G.en;
 for(var i=0;i<E.length&&i<2048;i++){
  var e=E[i];if(e.dead)continue;
  var cxi=Math.floor((e.x-ox)/GCELL),cyi=Math.floor((e.y-oy)/GCELL);
  if(cxi<0||cyi<0||cxi>=GN||cyi>=GN){e.gi=-1;continue;}
  var k=cyi*GN+cxi;GNEXT[i]=GHEAD[k];GHEAD[k]=i;e.gi=i;
 }
 G.gox=ox;G.goy=oy;
}
function near(x,y,r){
 QB.length=0;var ox=G.gox,oy=G.goy;
 var x0=Math.floor((x-r-ox)/GCELL),x1=Math.floor((x+r-ox)/GCELL),y0=Math.floor((y-r-oy)/GCELL),y1=Math.floor((y+r-oy)/GCELL);
 if(x0<0)x0=0;if(y0<0)y0=0;if(x1>=GN)x1=GN-1;if(y1>=GN)y1=GN-1;
 for(var cy=y0;cy<=y1;cy++)for(var cxx=x0;cxx<=x1;cxx++){
  var i=GHEAD[cy*GN+cxx];
  while(i>=0){var e=G.en[i];if(!e.dead){var dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<=rr*rr)QB.push(e);}i=GNEXT[i];}
 }
 return QB;
}
function nearest(x,y,maxd){
 var best=null,bd=maxd*maxd,E=G.en;
 for(var i=0;i<E.length;i++){var e=E[i];if(e.dead)continue;var dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e;}}
 return best;
}
function randomEnemy(x,y,maxd){
 var c=[],m2=maxd*maxd,E=G.en;
 for(var i=0;i<E.length&&c.length<40;i++){var e=E[(i*7+G.uid)%E.length];if(!e.dead){var dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<m2)c.push(e);}}
 return c.length?pick(c):null;
}

/* ---- dégâts ---- */
function num(x,y,v,col,big){if(G.nm.length>45)return;G.nm.push({x:x,y:y,v:v,c:col||"#fff",t:.6,b:big});}
function spark(x,y,col,n,sp){for(var i=0;i<n&&G.fx.length<260;i++){var a=Math.random()*6.28,s=rnd(.3,1)*(sp||90);G.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.25,.5),c:col,r:rnd(1.5,3.2)});}}
function hurtE(e,d,kx,ky,kf){
 if(e.dead)return;
 var crit=Math.random()<S.luck+.04;if(crit)d*=2;
 d=Math.max(1,Math.round(d));
 e.hp-=d;e.fl=.09;
 if(kf&&!e.boss){var l=Math.sqrt(kx*kx+ky*ky)||1;e.kx+=kx/l*kf;e.ky+=ky/l*kf;}
 num(e.x,e.y-e.r,d,crit?"#ffd36b":"#fff",crit);
 sfx("hit");
 if(e.hp<=0)killE(e);
}
function killE(e){
 if(e.dead)return;e.dead=true;G.kills++;
 spark(e.x,e.y,e.boss?"#ffd36b":"#fff",e.boss?30:6,e.boss?200:90);
 var def=e.def;
 if(e.boss){
  G.chestQ++;flash(L(BOSS[e.bi].n)+" ✔");sfx("boom");G.shake=.6;vib([60,40,120]);
  for(var i=0;i<14;i++)G.cn.push({x:e.x+rnd(-50,50),y:e.y+rnd(-50,50),v:3,t:0});
  for(var j=0;j<10;j++)G.gem.push({x:e.x+rnd(-60,60),y:e.y+rnd(-60,60),v:10,m:false});
  G.bossE=null;G.en.forEach(function(o){if(!o.boss&&!o.dead&&(o.sum||0)){o.dead=true;}});
  return;
 }

function step(dt){
 if(!G||G.state!=="play")return;
 G.t+=dt;var p=G.p;
 // entrée
 var ix=0,iy=0;
 if(JOY.on){ix=JOY.dx;iy=JOY.dy;}
 if(KEY.ArrowLeft||KEY.a||KEY.q)ix-=1;if(KEY.ArrowRight||KEY.d)ix+=1;if(KEY.ArrowUp||KEY.w||KEY.z)iy-=1;if(KEY.ArrowDown||KEY.s)iy+=1;
 if(G.bot){var bv=G.bot(G);ix=bv[0];iy=bv[1];}
 var il=Math.sqrt(ix*ix+iy*iy);if(il>1){ix/=il;iy/=il;}
 p.x+=ix*S.speed*dt;p.y+=iy*S.speed*dt;
 if(ix!==0)p.face=ix>0?1:-1;
 p.bob+=dt*(il>.1?12:2);
 if(p.inv>0)p.inv-=dt;
 if(S.regen>0&&p.hp<S.maxhp)p.hp=Math.min(S.maxhp,p.hp+S.regen*dt);
 spawnTick(dt);
 // ennemis
 var E=G.en,shooters=0;
 for(var i=0;i<E.length;i++){
  var e=E[i];if(e.dead)continue;
  e.t+=dt;if(e.fl>0)e.fl-=dt;
  var dx=p.x-e.x,dy=p.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/d,uy=dy/d,sp=e.sp,mx=ux,my=uy;
  var ty=e.type;
  if(e.boss)bossAI(e,dt,ux,uy,d);
  else{
   if(ty==="loc"){var ph=e.t%2.2;if(ph>1.7)sp*=5;else if(ph>1.2)sp*=.2;}
   else if(ty==="bat"){mx=ux+Math.sin(e.t*5)*.9*-uy;my=uy+Math.sin(e.t*5)*.9*ux;}
   else if(ty==="scor"){if(d<230){sp*=-.5;}if(d<300&&(e.at=(e.at||1.5)-dt)<=0){e.at=2.2;G.ep.push({x:e.x,y:e.y,vx:ux*150,vy:uy*150,r:7,dm:e.dm,life:3});}}
   else if(ty==="mosq"&&G.t>240){sp*=1.15;}
  }
  var mm=Math.sqrt(mx*mx+my*my)||1;
  e.x+=mx/mm*sp*dt+e.kx*dt*6;e.y+=my/mm*sp*dt+e.ky*dt*6;
  e.kx*=Math.max(0,1-dt*8);e.ky*=Math.max(0,1-dt*8);
  if(d>1100&&!e.boss){e.x=p.x-ux*(Math.max(W,H)*.6);e.y=p.y-uy*(Math.max(W,H)*.6);}
  var rr=e.r+p.r-2;
  if(d<rr)hurtP(e.dm);
 }
 // compacter
 var w=0;for(var j=0;j<E.length;j++){if(!E[j].dead)E[w++]=E[j];}E.length=w;
 gridBuild();
 // séparation douce
 for(var a=0;a<E.length;a++){
  var ea=E[a];if(ea.boss||ea.gi<0)continue;
  var li=near(ea.x,ea.y,ea.r);
  for(var b=0;b<li.length;b++){var eb=li[b];if(eb===ea||eb.boss)continue;var ddx=ea.x-eb.x,ddy=ea.y-eb.y,dd=Math.sqrt(ddx*ddx+ddy*ddy)||.01,ov=ea.r+eb.r-dd;if(ov>0){var pu=ov*.12;ea.x+=ddx/dd*pu;ea.y+=ddy/dd*pu;}}
 }
 updateWeapons(dt);updateProj(dt);
 // projectiles ennemis
 for(var q=G.ep.length-1;q>=0;q--){
  var pr=G.ep[q];pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;
  if(Math.hypot(pr.x-p.x,pr.y-p.y)<pr.r+p.r-2){hurtP(pr.dm);pr.life=0;}

 }

 for(var r=G.dr.length-1;r>=0;r--){

   if(dr.k==="mango"){p.hp=Math.min(S.maxhp,p.hp+S.maxhp*.3);num(p.x,p.y-22,"+"+Math.round(S.maxhp*.3),"#7bd88f",true);sfx("lvl");}
   else{G.gem.forEach(function(x){x.m=true;});G.cn.forEach(function(x){x.m=true;});sfx("lvl");}
   G.dr[r]=G.dr[G.dr.length-1];G.dr.pop();
  }
 }
 // effets
 for(var f=G.fx.length-1;f>=0;f--){var fx=G.fx[f];fx.x+=fx.vx*dt;fx.y+=fx.vy*dt;fx.vx*=.94;fx.vy*=.94;fx.t-=dt;if(fx.t<=0){G.fx[f]=G.fx[G.fx.length-1];G.fx.pop();}}
 for(var n=G.nm.length-1;n>=0;n--){var nm=G.nm[n];nm.y-=34*dt;nm.t-=dt;if(nm.t<=0){G.nm[n]=G.nm[G.nm.length-1];G.nm.pop();}}
 if(G.shake>0)G.shake-=dt;if(G.msgT>0)G.msgT-=dt;
 if(G.chestQ>0&&G.state==="play"){G.chestQ--;openLevelUp(true);}
 if(G.t>=WIN_T&&G.state==="play")endRun(true);
}

function buildChoices(){
 var out=[],evo=[],up=[],nw=[];
 for(var k in G.wp){var w=G.wp[k];if(w.lv===6&&G.ps[WP[k].p])evo.push({t:"evo",k:k});else if(w.lv<6)up.push({t:"w",k:k});}
 for(var k2 in WP){if(!G.wp[k2]&&wCount()<5)nw.push({t:"w",k:k2,nw:1});}
 for(var p in G.ps){if(G.ps[p]<5)up.push({t:"p",k:p});}
 for(var p2 in PS){if(!G.ps[p2]&&pCount()<5)nw.push({t:"p",k:p2,nw:1});}
 var pool=up.concat(nw);
 evo.forEach(function(x){out.push(x);});
 while(out.length<3&&pool.length){var i=ri(pool.length);out.push(pool.splice(i,1)[0]);}
 if(!out.length)out.push({t:"heal"});
 return out.slice(0,3);
}
var CH_NOW=[];
function openLevelUp(chest){
 G.state="levelup";G.chestMode=chest;sfx("lvl");vib(30);
 CH_NOW=buildChoices();renderLevelUp();
}
function renderLevelUp(){
 var h='<div class="box"><h2>'+(G.chestMode?t("chest"):t("lvlup"))+'</h2><div class="sub">'+t("level")+' '+G.lvl+'</div>';
 CH_NOW.forEach(function(c,i){
  var ic,nm,ds,tg="",lv="";
  if(c.t==="evo"){ic=WP[c.k].i;nm=L(WP[c.k].e);ds=L(WP[c.k].d);tg='<span class="tg">'+t("evoT")+'</span>';lv="★";}
  else if(c.t==="w"){var w=G.wp[c.k];ic=WP[c.k].i;nm=L(WP[c.k].n);ds=L(WP[c.k].d);lv=w?t("lv")+" "+w.lv+" → "+(w.lv+1):t("newT");if(!w)tg='<span class="tg">'+t("newT")+'</span>';
   if(w&&w.lv===5)ds+=" ("+t("evoPairs")+PS[WP[c.k].p].i+")";}
  else if(c.t==="p"){var pl=G.ps[c.k]||0;ic=PS[c.k].i;nm=L(PS[c.k].n);ds=L(PS[c.k].d);lv=pl?t("lv")+" "+pl+" → "+(pl+1):"";if(!pl)tg='<span class="tg">'+t("newT")+'</span>';}
  else{ic="🥭";nm=LANG==="fr"?"Mangue":"Mango";ds=LANG==="fr"?"Rend 50 % de ta vie.":"Heals 50% HP.";}
  h+='<div class="card" onclick="choose('+i+')"><div class="ic">'+ic+'</div><div><b>'+nm+tg+'</b><small>'+(lv?'<b style="display:inline;color:#ffd36b">'+lv+'</b> · ':'')+ds+'</small></div></div>';
 });
 if(G.rr>0&&!G.chestMode)h+='<button class="btn g sm" onclick="rerollCh()">🎲 '+t("reroll")+' ('+G.rr+')</button>';
 h+='</div>';
 var o=document.getElementById("lvl");o.innerHTML=h;o.classList.add("on");
}
function rerollCh(){if(G.rr<=0)return;G.rr--;CH_NOW=buildChoices();renderLevelUp();}
function choose(i){
 var c=CH_NOW[i];if(!c)return;
 if(c.t==="evo"){G.wp[c.k].lv=7;flash(L(WP[c.k].e)+" !");sfx("boom");G.shake=.3;}
 else if(c.t==="w"){if(G.wp[c.k])G.wp[c.k].lv++;else G.wp[c.k]={lv:1,cd:.2};}
 else if(c.t==="p"){G.ps[c.k]=(G.ps[c.k]||0)+1;recalc();}
 else{G.p.hp=Math.min(S.maxhp,G.p.hp+S.maxhp*.5);}
 document.getElementById("lvl").classList.remove("on");
 G.state="play";
 if(G.xp>=G.xpn){G.xp-=G.xpn;G.lvl++;G.xpn=need(G.lvl);openLevelUp(false);}
}

/* =================== Affichage =================== */
var CAM={x:0,y:0};
function hash(a,b){var h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;}
function lerp(a,b,u){return a+(b-a)*u;}
function mix(c1,c2,u){return "rgb("+Math.round(lerp(c1[0],c2[0],u))+","+Math.round(lerp(c1[1],c2[1],u))+","+Math.round(lerp(c1[2],c2[2],u))+")";}
var NIGHT=[28,22,52],MID=[58,36,66],DAWN=[238,160,90];
function drawBG(){
 var tt=G?G.t:0,u=Math.min(1,tt/WIN_T);
 var col=u<.7?mix(NIGHT,MID,u/.7):mix(MID,DAWN,(u-.7)/.3);
 cx.fillStyle=col;cx.fillRect(0,0,W,H);
 var cs=96,x0=Math.floor((CAM.x-W/2)/cs)-1,y0=Math.floor((CAM.y-H/2)/cs)-1,x1=x0+Math.ceil(W/cs)+3,y1=y0+Math.ceil(H/cs)+3;
 for(var gy=y0;gy<=y1;gy++)for(var gx=x0;gx<=x1;gx++){
  var h=hash(gx,gy),sx=gx*cs-CAM.x+W/2,sy=gy*cs-CAM.y+H/2;
  if(h<.55){cx.fillStyle="rgba(255,255,255,.05)";cx.fillRect(sx+h*60,sy+hash(gy,gx)*60,10+h*14,4);}
  else if(h<.6){drawSpr(["🧺","🪑","📦","🛢️","🪣"][Math.floor(h*100)%5],26,sx+30,sy+30,.55);}
  else if(h<.625){drawSpr(["🏚️","⛺","🛖"][Math.floor(h*1000)%3],44,sx+30,sy+30,.5);}
 }
}
function sx(x){return x-CAM.x+W/2;}
function sy(y){return y-CAM.y+H/2;}
function render(){
 if(!G){cx.fillStyle="#14102a";cx.fillRect(0,0,W,H);return;}
 var p=G.p;
 CAM.x=p.x;CAM.y=p.y;
 var shx=0,shy=0;if(G.shake>0){shx=rnd(-1,1)*G.shake*14;shy=rnd(-1,1)*G.shake*14;CAM.x+=shx;CAM.y+=shy;}
 drawBG();
 // zones
 for(var z=0;z<G.zn.length;z++){var zn=G.zn[z];cx.fillStyle="rgba(255,100,30,"+(.18+.1*Math.sin(G.t*10+z))+")";cx.beginPath();cx.arc(sx(zn.x),sy(zn.y),zn.r,0,6.283);cx.fill();}
 // gemmes, pièces, drops
 for(var g=0;g<G.gem.length;g++){var gm=G.gem[g];drawSpr(gm.v>=8?"💠":gm.v>=3?"🔷":"💎",gm.v>=8?20:14,sx(gm.x),sy(gm.y));}
 for(var c=0;c<G.cn.length;c++){var cn=G.cn[c];drawSpr("🪙",14,sx(cn.x),sy(cn.y));}
 for(var d=0;d<G.dr.length;d++){var dr=G.dr[d];drawSpr(dr.k==="mango"?"🥭":"🧲",22,sx(dr.x),sy(dr.y)+Math.sin(G.t*5)*2);}
 // ennemis
 var E=G.en;
 for(var i=0;i<E.length;i++){
  var e=E[i];if(e.dead)continue;var X=sx(e.x),Y=sy(e.y);if(X<-80||Y<-80||X>W+80||Y>H+80)continue;
  cx.fillStyle="rgba(0,0,0,.25)";cx.beginPath();cx.ellipse(X,Y+e.r*.7,e.r*.9,e.r*.35,0,0,6.283);cx.fill();
  if(e.elite){cx.fillStyle="rgba(255,200,60,.28)";cx.beginPath();cx.arc(X,Y,e.r*1.25,0,6.283);cx.fill();}
  var fl=e.fl>0;
  var wob=Math.sin(e.t*8)*.08;
  drawSpr(e.def.i,e.sz,X,Y,fl?.55:1,wob,e.x<p.x);
  if(fl){cx.fillStyle="rgba(255,255,255,.35)";cx.beginPath();cx.arc(X,Y,e.r,0,6.283);cx.fill();}
 }
 // anneaux
 for(var r=0;r<G.rg.length;r++){var rg=G.rg[r];if(rg.r<=0)continue;cx.strokeStyle=rg.col;cx.globalAlpha=Math.max(0,.8*(1-rg.r/rg.max));cx.lineWidth=6;cx.beginPath();cx.arc(sx(rg.x),sy(rg.y),rg.r,0,6.283);cx.stroke();cx.globalAlpha=1;}
 // calebasses
 var cw=G.wp.cal;if(cw&&cw.orbs)for(var o=0;o<cw.orbs.length;o++)drawSpr("🥥",cw.lv>=7?30:24,sx(cw.orbs[o][0]),sy(cw.orbs[o][1]),1,G.t*6);
 // projectiles
 for(var q=0;q<G.pr.length;q++){
  var pr=G.pr[q];
  if(pr.k==="san")drawSpr("🩴",pr.evo?40:30,sx(pr.x),sy(pr.y),1,pr.rot);
  else if(pr.k==="pet")drawSpr("🧨",16,sx(pr.x),sy(pr.y),1,Math.atan2(pr.vy,pr.vx)+1.57);
  else if(pr.k==="pim"&&pr.f>=0)drawSpr("🌶️",22,sx(pr.x),sy(pr.y)-(pr.z||0),1,G.t*10);
 }
 for(var b=0;b<G.bl.length;b++){var bl=G.bl[b];cx.strokeStyle="#fff7a8";cx.lineWidth=4;cx.beginPath();var bx=sx(bl.x),by=sy(bl.y);cx.moveTo(bx+rnd(-8,8),by-400);cx.lineTo(bx+rnd(-12,12),by-200);cx.lineTo(bx+rnd(-8,8),by-100);cx.lineTo(bx,by);cx.stroke();cx.fillStyle="rgba(255,240,120,.4)";cx.beginPath();cx.arc(bx,by,30,0,6.283);cx.fill();}
 for(var ep=0;ep<G.ep.length;ep++){var e2=G.ep[ep];cx.fillStyle="#c04bff";cx.beginPath();cx.arc(sx(e2.x),sy(e2.y),e2.r,0,6.283);cx.fill();cx.fillStyle="#fff";cx.beginPath();cx.arc(sx(e2.x),sy(e2.y),e2.r*.45,0,6.283);cx.fill();}
 // joueur
 var px=sx(p.x),py=sy(p.y);
 cx.fillStyle="rgba(0,0,0,.3)";cx.beginPath();cx.ellipse(px,py+12,12,5,0,0,6.283);cx.fill();
 var blink=p.inv>0&&Math.floor(G.t*20)%2===0;
 if(!blink)drawSpr(CH[SAVE.ch].i,34,px,py-Math.abs(Math.sin(p.bob))*3,1,0,p.face<0);
 if(S.magnet&&G.t<4){cx.strokeStyle="rgba(255,255,255,.12)";cx.lineWidth=1;cx.beginPath();cx.arc(px,py,S.magnet,0,6.283);cx.stroke();}
 // particules
 for(var f=0;f<G.fx.length;f++){var fx=G.fx[f];cx.globalAlpha=Math.min(1,fx.t*3);cx.fillStyle=fx.c;cx.fillRect(sx(fx.x)-fx.r,sy(fx.y)-fx.r,fx.r*2,fx.r*2);}cx.globalAlpha=1;
 // nombres
 cx.textAlign="center";cx.textBaseline="middle";
 for(var n=0;n<G.nm.length;n++){var nm=G.nm[n];cx.font=(nm.b?"bold 17px":"bold 12px")+" system-ui";cx.lineWidth=3;cx.strokeStyle="rgba(0,0,0,.7)";cx.strokeText(nm.v,sx(nm.x),sy(nm.y));cx.fillStyle=nm.c;cx.fillText(nm.v,sx(nm.x),sy(nm.y));}
 // lueur de l'aube / vignette
 if(G.t>WIN_T*.78){var al=Math.min(.22,(G.t-WIN_T*.78)/(WIN_T*.22)*.22);cx.fillStyle="rgba(255,190,100,"+al+")";cx.fillRect(0,0,W,H);}
 var vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");cx.fillStyle=vg;cx.fillRect(0,0,W,H);
 // dégâts reçus : liseré rouge
 if(p.inv>.3){cx.fillStyle="rgba(255,40,40,"+(p.inv-.3)*.9+")";cx.fillRect(0,0,W,H);}
 hud();
 // joystick
 if(JOY.on){cx.strokeStyle="rgba(255,255,255,.35)";cx.lineWidth=3;cx.beginPath();cx.arc(JOY.ox,JOY.oy,46,0,6.283);cx.stroke();cx.fillStyle="rgba(255,255,255,.3)";cx.beginPath();cx.arc(JOY.ox+JOY.dx*40,JOY.oy+JOY.dy*40,20,0,6.283);cx.fill();}
}
function hud(){

 // xp
 cx.fillStyle="rgba(0,0,0,.45)";cx.fillRect(0,0,W,10);cx.fillStyle="#58d3ff";cx.fillRect(0,0,W*Math.min(1,G.xp/G.xpn),10);

 var ix=8,iy=H-34;cx.textAlign="center";
 for(var k in G.wp){drawSpr(WP[k].i,20,ix+14,iy+8,1);cx.fillStyle="#ffd36b";cx.font="bold 10px system-ui";cx.fillText(G.wp[k].lv>=7?"★":G.wp[k].lv,ix+14,iy+26);ix+=30;}
 ix+=8;for(var k2 in G.ps){drawSpr(PS[k2].i,18,ix+13,iy+8,1);cx.fillStyle="#fff";cx.font="bold 10px system-ui";cx.fillText(G.ps[k2],ix+13,iy+26);ix+=28;}
 // message
 if(G.msgT>0){cx.globalAlpha=Math.min(1,G.msgT);cx.font="bold 24px system-ui";cx.lineWidth=5;cx.strokeStyle="rgba(0,0,0,.7)";cx.strokeText(G.msg,W/2,H*.28);cx.fillStyle="#ffd36b";cx.fillText(G.msg,W/2,H*.28);cx.globalAlpha=1;}
}

/* =================== Entrées =================== */
cv.addEventListener("pointerdown",function(e){
 if(!G||G.state!=="play"||JOY.on)return;
 try{cv.setPointerCapture(e.pointerId);}catch(x){}
 JOY.on=true;JOY.id=e.pointerId;JOY.ox=e.clientX;JOY.oy=e.clientY;JOY.dx=JOY.dy=0;
});
cv.addEventListener("pointermove",function(e){
 if(!JOY.on||e.pointerId!==JOY.id)return;
 var dx=e.clientX-JOY.ox,dy=e.clientY-JOY.oy,l=Math.sqrt(dx*dx+dy*dy),m=46;
 if(l>m){JOY.ox+=dx/l*(l-m);JOY.oy+=dy/l*(l-m);dx=e.clientX-JOY.ox;dy=e.clientY-JOY.oy;l=m;}
 JOY.dx=l>6?dx/m:0;JOY.dy=l>6?dy/m:0;
});
function jEnd(e){if(e.pointerId===JOY.id){JOY.on=false;JOY.dx=JOY.dy=0;}}
cv.addEventListener("pointerup",jEnd);cv.addEventListener("pointercancel",jEnd);
window.addEventListener("keydown",function(e){KEY[e.key]=true;if(e.key==="Escape")pauseGame();});
window.addEventListener("keyup",function(e){KEY[e.key]=false;});
document.addEventListener("visibilitychange",function(){if(document.hidden)pauseGame();});

/* =================== Boucle =================== */
var last=0,acc=0;
function frame(ts){
 var dt=Math.min(.1,(ts-last)/1000||0);last=ts;
 if(G&&G.state==="play"){acc+=dt;var n=0;while(acc>=1/60&&n<5){step(1/60);acc-=1/60;n++;}if(n===5)acc=0;}
 render();requestAnimationFrame(frame);
}
window.__G=function(){return G;};window.__step=step;window.__S=function(){return S;};
window.__choose=choose;window.__start=startGame;window.__CHN=function(){return CH_NOW;};window.__SAVE=function(){return SAVE;};
menuMain();
requestAnimationFrame(frame);
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script></body></html>
